<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCC Tenders</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f9;--panel:#fff;--ink:#16213a;--muted:#5f6b7f;--line:#e2e7f0;--brand:#14325c;--brand2:#e07a1f;--brand3:#2563a8;--soft:#fff2e5;--soft2:#eaf1fb;--fz:#ffe873;--ok:#18794e;--warn:#c2410c;--new:#eaf1fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif}
header{background:linear-gradient(120deg,#102a4f 0%,#14325c 45%,#1f4f8a 100%);border-bottom:3px solid var(--brand2);color:#fff;padding:10px 20px;box-shadow:0 2px 10px rgba(11,42,74,.25);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .stat{font-size:12.5px;opacity:.92}
header .sp{flex:1}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--brand2);color:var(--brand2)}
button.pri{background:var(--brand2);border-color:var(--brand2);color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(224,122,31,.28)}
button.pri:hover{background:#c96a14;color:#fff}
header button{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.ctry{display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:10px;overflow:hidden}
.ctry button{border:0;border-radius:0;background:transparent;color:#fff;padding:6px 13px}
.ctry button.on{background:#fff;color:var(--brand);font-weight:700}
.bar{padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar input[type=search]{flex:1;min-width:260px;font:inherit;font-size:16px;padding:9px 14px;border:1.5px solid var(--line);border-radius:10px;outline:none}
.bar input[type=search]:focus{border-color:var(--brand2)}
select,.bar input[list]{font:inherit;padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 13px}
.seg button.on{background:var(--brand);color:#fff;font-weight:700}
.chips{padding:8px 20px 0;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.chip.fresh{border-color:var(--brand3);color:var(--brand3)}
.chip.fresh.on{background:var(--brand3);color:#fff}
.chip b{margin-inline-start:4px}
main{display:grid;grid-template-columns:minmax(360px,44%) 1fr;gap:14px;padding:12px 20px;height:calc(100vh - 220px)}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:0 1px 2px rgba(15,27,45,.06),0 4px 14px rgba(15,27,45,.06)}
.col h3{margin:0;padding:10px 14px;font-size:14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.res{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.res:hover{background:var(--soft2)}
.res.sel{background:var(--soft);border-right:4px solid var(--brand2)}
.res.unread{background:#fff4d6;border-right:4px solid #f59e0b}.res.unread.sel{background:#ffe9b0}
.bdg{display:inline-block;min-width:18px;background:#e5484d;color:#fff;border-radius:20px;font-size:11px;line-height:17px;padding:0 6px;margin-inline-start:6px;font-weight:700;text-align:center}
.bdg:empty{display:none}
.wk{font-size:11px;border-radius:20px;padding:0 8px;background:#e8eef6;color:#26476e;font-weight:700}
.wk.us{background:var(--fz);color:#5a4b00}
.mail{white-space:pre-wrap;font-size:13px;background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:420px;overflow:auto}
.res .t{font-weight:600}
.m{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;align-items:center}
.tno{direction:ltr;unicode-bidi:isolate;display:inline-block;background:#f0f3f7;border-radius:5px;padding:0 6px;font-size:12.5px}
.st{display:inline-block;font-size:11.5px;padding:0 8px;border-radius:20px;font-weight:600}
.st-open{background:#d7f0e0;color:#12613a}.st-soon{background:#fde8c8;color:#8a4b00}.st-study{background:#e6ebf2;color:#34465c}
.st-award{background:#dde7fb;color:#1f3f8a}.st-cancel{background:#fbdcdc;color:#8a1f1f}.st-run{background:#efe3fb;color:#5b2a86}
.flag{font-size:11px;border-radius:20px;padding:0 7px;font-weight:700}
.flag-new{background:#2e6aa3;color:#fff}.flag-chg{background:#ffd8a8;color:#7a3e00}
.cc{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:0 6px}
.off{font-size:12px;font-weight:700;color:#0b5aa5;text-decoration:none;border:1px solid #bcd3ee;border-radius:6px;padding:0 6px;background:#f1f7fe}
.off:hover{background:#e0eefc}
.urgent{color:var(--warn);font-weight:700}
.fz{background:var(--fz);padding:0 4px;border-radius:4px}
.fzb{background:var(--fz);color:#5a4b00;font-size:11px;border-radius:20px;padding:0 7px}
.money{font-weight:700;color:var(--ok)}
.pad{padding:14px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px}
.kv div:nth-child(odd){color:var(--muted)}
h4{margin:14px 0 6px;font-size:14px;color:var(--brand);border-right:3px solid var(--brand2);padding-right:7px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:right;vertical-align:top}
th{background:var(--soft2);color:var(--brand)}
tr.chg td{background:#fff7ec}
.hit{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;gap:10px}
.badge{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:20px;background:#eef2f6;margin-inline-start:6px}
.snip{color:var(--muted);font-size:12px;margin-top:3px;max-height:3.2em;overflow:hidden}
.actions{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);padding:30px;text-align:center}
.log{font-size:12px;white-space:pre-wrap;background:#0f1a24;color:#cfe3f5;border-radius:8px;padding:8px;max-height:150px;overflow:auto;margin:8px 20px 0}
a{color:#0b5aa5}
.only-items,.only-awards{display:contents}
#modal{position:fixed;inset:0;background:rgba(10,20,30,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:5}
#modal img{max-width:min(900px,96vw);background:#fff;border-radius:6px}
#toast{position:fixed;bottom:18px;left:18px;background:#1d2733;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:6;max-width:460px}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto}}
#login{position:fixed;inset:0;background:linear-gradient(120deg,#102a4f 0%,#14325c 45%,#1f4f8a 100%);display:none;align-items:center;justify-content:center;z-index:50}
#login .box{background:#fff;border-radius:14px;padding:26px 28px;width:340px;max-width:calc(100vw - 32px);box-shadow:0 10px 40px rgba(0,0,0,.3)}
#login h2{margin:0 0 4px;direction:ltr;text-align:center;color:var(--brand)}
#login p{margin:0 0 16px;text-align:center;color:var(--muted);font-size:13px}
#login input[type=text],#login input[type=password]{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;direction:ltr}
#login button.pri{width:100%;padding:9px;margin-top:6px}
#login .err{color:var(--warn);font-size:13px;min-height:20px;text-align:center;margin-top:8px}
#login a{font-size:12.5px;color:var(--brand2)}
.me{font-size:12.5px;background:rgba(255,255,255,.14);border-radius:8px;padding:3px 10px}
.fbar{padding:8px 20px;background:#fbfcfe;border-bottom:1px solid var(--line);display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:13px}
.fbar .fl{color:var(--brand);font-weight:700}
.fbar input,.fbar select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.fbar input[type=text]{width:190px}
.fbar .qd button{padding:4px 9px;font-size:12.5px;border-radius:20px}
.fbar .on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.fbar .tool{background:var(--brand);color:#fff;border-color:var(--brand)}
.fbar .tool:hover{background:#1f4f8a;color:#fff}
.fbar .sp{flex:1}
.fcount{background:var(--brand2);color:#fff;border-radius:20px;padding:0 7px;font-size:11px;font-weight:700}
#scanbox{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:center;justify-content:center;z-index:30}
#scanbox .box{background:#fff;border-radius:14px;padding:18px 20px;width:min(720px,94vw);max-height:86vh;overflow:auto}
#scanbox .w{display:inline-block;margin:3px;padding:3px 10px;border:1px solid var(--line);border-radius:20px;cursor:pointer;background:var(--soft2)}
#scanbox .w.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
#scanbox img{max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line)}
.rt{display:flex;gap:10px;align-items:flex-start}.rt .ic{font-size:22px;line-height:1}
.rst{font-size:11px;border-radius:20px;padding:0 8px;font-weight:700}.rst.running{background:#fff1d6;color:#8a4b00}.rst.done{background:#d9f2e4;color:#12613a}.rst.error{background:#fde2dc;color:#9a2a10}
.rep td{vertical-align:middle}.rep a{margin-inline-start:8px;white-space:nowrap}
.recp label{display:inline-flex;gap:4px;align-items:center;margin:3px 8px 3px 0;background:var(--soft2);border-radius:20px;padding:2px 10px}
.pwd{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;background:var(--soft);border-radius:6px;padding:0 6px}
.ptitle{display:none}
@media print{
  header,.bar,.fbar,.chips,.actions,#toast,#log,#login,#scanbox,.np{display:none!important}
  body{background:#fff}
  main{display:block;height:auto;padding:0}
  .col{border:0;box-shadow:none;overflow:visible;margin-bottom:14px}
  .col h3{position:static}
  .res{break-inside:avoid}
  .ptitle{display:block;padding:0 4px 10px;border-bottom:2px solid var(--brand2);margin-bottom:8px}
  .ptitle b{font-size:17px;color:var(--brand)}
}
</style>
</head>
<body>
<header>
  <h1 style="direction:ltr">GCC Tenders</h1><span class="stat" style="opacity:.75">مناقصات ومشاريع الخليج</span>
  <div class="ctry" id="ctry"><button data-c="" class="on">الكل</button><button data-c="KW">الكويت</button><button data-c="SA">السعودية</button><button data-c="AE">الإمارات</button></div>
  <span class="stat" id="stat">...</span>
  <span class="sp"></span>
  <label class="stat" title="البرنامج بيجيب الجديد من المواقع لوحده طول ما هو شغال (حتى لو النافذة مقفولة)">تحديث تلقائي
    <select id="auto" style="color:var(--ink)"><option value="5">كل 5 دقايق</option><option value="15">كل ربع ساعة</option><option value="30">كل نص ساعة</option><option value="60">كل ساعة</option><option value="360">كل 6 ساعات</option><option value="0">مقفول</option></select></label>
  <button id="btnUpdate" title="يجيب الجديد من المواقع دلوقتي">تحديث دلوقتي</button>
  <button onclick="post('/api/open-folder')">فولدر التقارير</button>
  <span class="me" id="me" style="display:none"></span><button id="btnOut" style="display:none" title="تسجيل خروج">خروج</button>
</header>
<div id="login"><form class="box" id="lform" autocomplete="on">
  <h2>GCC Tenders</h2><p>دليل مناقصات الخليج - سجّل دخولك</p>
  <input type="text" id="lu" placeholder="اسم المستخدم" autocomplete="username" required>
  <input type="password" id="lp" placeholder="كلمة السر" autocomplete="current-password" required>
  <label style="font-size:13px"><input type="checkbox" id="lr" checked> افتكرني على الجهاز ده (30 يوم)</label>
  <button class="pri" type="submit" id="lgo">دخول</button>
  <div class="err" id="lerr"></div>
  <div style="text-align:center"><a href="#" id="lforgot">نسيت كلمة السر؟</a></div>
  <p style="margin:10px 0 0;font-size:11.5px">نفس حساب تطبيق الموبايل. الحسابات بيعملها الأدمن.</p>
</form></div>
<div class="bar">
  <div class="seg" id="mode"><button data-m="items" class="on">المناقصات والمشاريع</button><button data-m="news">الأخبار</button><button data-m="awards">ترسيات ومحاضر الكويت</button><button data-m="projects">شغل المشاريع</button><button data-m="routines">الروتينات والتقارير</button><button data-m="watch">متابعة فواز و KJAC</button></div>
  <input type="search" id="q" placeholder="اكتب عنوان المناقصة أو المشروع أو رقمها أو الجهة ... (فاضي = المطروح بترتيب الإقفال)" autofocus>
  <span class="only-items">
    <select id="cat"><option value="">كل أنواع الشغل</option></select>
    <input list="orgs" id="org" placeholder="الجهة"><datalist id="orgs"></datalist>
    <select id="days"><option value="0">أي موعد إقفال</option><option value="7">بيقفل خلال أسبوع</option><option value="14">خلال أسبوعين</option><option value="30">خلال شهر</option></select>
    <label><input type="checkbox" id="fawaz"> نطاق فواز</label>
  </span>
  <span class="only-awards" style="display:none"><select id="ayear"><option value="">كل السنين</option></select><label><input type="checkbox" id="amin"> بحث مباشر في المحاضر</label><label><input type="checkbox" id="agz"> بحث في أعداد الكويت اليوم</label><button onclick="post('/api/open-excel')">افتح إكسيل الترسيات</button></span>
  <button class="pri" id="go">بحث</button>
</div>
<div class="fbar" id="fbar">
  <span class="fl">فلترة وترتيب <span class="fcount" id="fcount" style="display:none"></span></span>
  <label>من <input type="date" id="fdfrom"></label><label>لحد <input type="date" id="fdto"></label>
  <span class="qd"><button data-qd="7">آخر أسبوع</button><button data-qd="30">آخر شهر</button><button data-qd="90">آخر 3 شهور</button><button data-qd="y">السنة دي</button></span>
  <select id="fdby" title="التاريخ اللي بيتفلتر بيه"><option value="">التاريخ: الأنسب</option><option value="publish">بتاريخ الطرح</option><option value="closing">بتاريخ الإقفال</option><option value="award">بتاريخ الترسية</option></select>
  <select id="fsort"><option value="">الترتيب: الأهم</option><option value="new">الأحدث الأول</option><option value="old">الأقدم الأول</option><option value="closing">الإقفال الأقرب</option><option value="value">القيمة الأعلى</option></select>
  <input type="text" id="fco" placeholder="🏢 اسم الشركة / المقاول">
  <input type="text" id="fcl" placeholder="🏛 الوزارة / الجهة / العميل">
  <button id="fclear">مسح الفلاتر</button>
  <span class="sp"></span>
  <button class="tool" id="bscan" title="صوّر أو اختار صورة فيها اسم المناقصة - البرنامج يطلّع الكلام اللي فيها وتدوّر بيه (أو Ctrl+V لصورة منسوخة)">📷 بحث بصورة</button><input type="file" id="fscan" accept="image/*" hidden>
  <button class="tool" id="bprint" title="اطبع النتايج والتفاصيل اللي على الشاشة">🖨 طباعة</button>
</div>
<div class="chips" id="chips"></div>
<div id="scanbox"><div class="box"><b style="color:var(--brand);font-size:16px">📷 البحث بصورة</b>
  <div id="scanbody" style="margin-top:10px"></div>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="pri" id="scango">دوّر بالكلام المتعلّم</button><button id="scanall">علّم الكل</button><button id="scanx">إلغاء</button></div></div></div>
<pre class="log" id="log" style="display:none"></pre>
<main>
  <section class="col"><div class="ptitle" id="ptitle"></div><h3 id="lh">النتائج</h3><div id="results"><div class="empty">بحمّل...</div></div></section>
  <section class="col"><h3>التفاصيل</h3><div id="detail"><div class="empty">اختار مناقصة أو مشروع</div></div></section>
</main>
<div id="modal" onclick="this.style.display='none'"><img id="mimg" alt=""></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const isFz=s=>/فواز|fawaz/i.test(s||'');
const today=new Date().toISOString().slice(0,10);
const CN={KW:'الكويت',SA:'السعودية',AE:'الإمارات'};
let mode='items',status='',fresh=0,country='',current=null,hits=[],lastQ='';
const STATUSES=['مطروحة','اتوافق على طرحها','إعلان مسبق','مقفولة - تحت الدراسة','أسعار معلنة','مترسية','عقد جاري (قرار الجهاز)','ملغاة'];
function stClass(s,closing){if(s==='مطروحة'){const d=(new Date(closing)-new Date(today))/864e5;return d<=7?'st-soon':'st-open'}
  return {'مترسية':'st-award','ملغاة':'st-cancel','عقد جاري (قرار الجهاز)':'st-run','اتوافق على طرحها':'st-soon','إعلان مسبق':'st-soon'}[s]||'st-study'}
function toast(m,ms=4000){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms)}
function chk(r,j){if(r.status===401){showLogin();const e=new Error(j.error||'سجّل دخولك');e.login=1;throw e}if(j&&j.error)throw new Error(j.error);return j}
async function get(u){const r=await fetch(u);return chk(r,await r.json())}
async function post(u,b={}){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return chk(r,await r.json())}
// ---------------------------------------------------------------- login + permissions (same accounts as the phone app)
let ME=null;
const can=p=>!!ME&&(p==='admin'?ME.admin:(ME.perms.includes(p)||(p==='awards'&&ME.perms.includes('watch'))));
const MODE_NEED={items:'dir',news:'news',awards:'awards',projects:'projects',routines:'routines',watch:'watch'};
// the filter bar (every tab): period, order, company, client
function FX(){const o={dfrom:$('#fdfrom').value,dto:$('#fdto').value,sort:$('#fsort').value,company:$('#fco').value.trim(),client:$('#fcl').value.trim(),dby:mode==='items'?$('#fdby').value:''};
  Object.keys(o).forEach(k=>{if(!o[k])delete o[k]});return o}
function fxq(){const p=new URLSearchParams(FX()).toString();return p?'&'+p:''}
function fxCount(){const n=Object.keys(FX()).length;$('#fcount').textContent=n;$('#fcount').style.display=n?'':'none';return n}
function wfilter(list,dateOf,textOf,clientOf){const f=FX();if(!Object.keys(f).length)return list;
  let out=list.filter(x=>{const d=(dateOf(x)||'').slice(0,10);
    if(f.dfrom&&!(d&&d>=f.dfrom))return false;if(f.dto&&!(d&&d<=f.dto))return false;
    if(f.company&&!norm(f.company).split(' ').every(w=>norm(textOf(x)).includes(w)))return false;
    if(f.client&&!norm(f.client).split(' ').every(w=>norm((clientOf||textOf)(x)).includes(w)))return false;return true});
  if(f.sort==='new')out=out.slice().sort((a,b)=>(dateOf(b)||'').localeCompare(dateOf(a)||''));
  if(f.sort==='old')out=out.slice().sort((a,b)=>(dateOf(a)||'9').localeCompare(dateOf(b)||'9'));
  return out}
function setPeriod(v){const d=new Date();let from;if(v==='y')from=d.getFullYear()+'-01-01';else{d.setDate(d.getDate()-(+v));from=d.toISOString().slice(0,10)}
  $('#fdfrom').value=from;$('#fdto').value='';if(!$('#fsort').value)$('#fsort').value='new';search()}
function showLogin(msg){ME=null;$('#login').style.display='flex';$('#lerr').textContent=msg||'';setTimeout(()=>($('#lu').value?$('#lp'):$('#lu')).focus(),50)}

async function searchRoutines(q,keep){
  try{await loadRT()}catch(e){$('#results').innerHTML=`<div class="empty">خطأ: ${esc(e.message)}</div>`;return}
  $('#chips').innerHTML=`${can('admin')?`<span class="chip" id="rtmail">📧 الإيميلات (منه وليه)<b>${RT.recipients.length}</b></span>`:''}`+(!RT.claude?`<span class="chip" title="روتينات Claude بتشتغل من الزرار لما Claude Code يكون على الجهاز">⚠ Claude Code مش موجود</span>`
      :(!RT.claude_login&&can('admin')?`<span class="chip on" id="rtsign" title="مرة واحدة: سجّل دخول Claude عشان روتينات Claude تشتغل من الزرار ومن الموبايل">🔑 سجّل دخول Claude</span>`:''));
  if($('#rtsign'))$('#rtsign').onclick=async()=>{const x=await post('/api/routines/signin');toast(x.msg,10000);setTimeout(()=>searchRoutines($('#q').value.trim(),true),60000)};
  if($('#rtmail'))$('#rtmail').onclick=recipientsBox;
  const qq=norm(q);const list=RT.routines.filter(r=>!qq||norm(r.title+' '+r.description+' '+r.reports.map(x=>x.name).join(' ')).includes(qq));
  $('#lh').textContent=`الروتينات (${list.length})`;
  $('#results').innerHTML=list.map(r=>`<div class="res ${r.id===rsel?'sel':''}" data-rt="${esc(r.id)}"><div class="rt"><span class="ic">${r.icon}</span><div><div class="t">${esc(r.title)}</div>
    <div class="m"><span>${esc(r.when)}</span><span class="wk">${KIND[r.kind]}</span>${r.last_run?`<span class="rst ${r.last_run.status}">${RSTAT[r.last_run.status]||''} ${esc(r.last_run.at.replace('T',' '))}</span>`:''}</div>
    <div class="m">${r.reports.length?`<span>${r.reports.length} تقرير · آخر واحد ${esc(r.last_report.replace('T',' '))}</span>`:'<span>مفيش تقارير محفوظة</span>'}</div></div></div></div>`).join('');
  document.querySelectorAll('.res[data-rt]').forEach(el=>el.onclick=()=>{sel(el);rsel=el.dataset.rt;routineDetail(rsel)});
  if(rsel&&keep!==false)routineDetail(rsel);else if(!keep)$('#detail').innerHTML='<div class="empty">اختار روتين: تشوف تقاريره، تفتحها، تطبعها، تبعتها أو تشاركها، أو تشغّله دلوقتي</div>';
  if(RT.routines.some(r=>r.last_run&&r.last_run.status==='running')){clearTimeout(window._rt);window._rt=setTimeout(()=>{if(mode==='routines')searchRoutines($('#q').value.trim(),true)},15000)}
}
function routineDetail(id){const r=RT.routines.find(x=>x.id===id);if(!r)return;
  let h=`<div class="pad"><div class="card" style="border-color:var(--brand2)"><div class="rt"><span class="ic" style="font-size:30px">${r.icon}</span><div><b style="font-size:16px">${esc(r.title)}</b>
    <div class="m"><span>${esc(r.when)}</span><span class="wk">${KIND[r.kind]}</span></div>${r.description?`<p class="snip" style="max-height:none">${esc(r.description)}</p>`:''}</div></div>
    ${r.last_run?`<p class="m"><span class="rst ${r.last_run.status}">${RSTAT[r.last_run.status]||''}</span><span>${esc(r.last_run.at.replace('T',' '))}</span><span>${esc(r.last_run.msg||'')}</span></p>`:''}
    <button class="pri" id="rtrun" style="${can('run')?'':'display:none'}" ${r.can_run?'':'disabled'} title="${r.can_run?'يشتغل دلوقتي في الخلفية':(r.kind==='claude'?'محتاج Claude Code متسطب على الجهاز':'بيتعمل من تفاصيل المناقصة')}">▶ شغّل دلوقتي</button>
    ${!r.can_run&&r.kind==='claude'?`<p class="snip">الروتين ده شغّال لوحده في مواعيده من Claude. ${RT.claude?'زرار التشغيل محتاج تسجيل دخول Claude مرة واحدة (🔑 فوق).':'زرار التشغيل محتاج Claude Code على الجهاز.'}</p>`:''}</div>`;
  if(r.reports.length){h+=`<h4>التقارير (${r.reports.length})</h4><table class="rep"><tr><th><input type="checkbox" id="rpall"></th><th>الملف</th><th>اتعمل</th><th></th></tr>${r.reports.map((x,i)=>`<tr><td><input type="checkbox" class="rpck" value="${i}"></td>
    <td>${{pdf:'📕',xlsx:'📗',xlsm:'📗',xls:'📗',docx:'📘',doc:'📘',html:'🌐'}[x.ext]||'📄'} ${esc(x.name)}<div class="snip">${esc(x.folder)} · ${(x.size/1048576).toFixed(1)} MB</div></td><td>${esc(x.at.replace('T',' '))}</td>
    <td>${can('share')?`<a href="#" data-ro="${i}">فتح</a>`:''}${can('print')&&can('share')?`<a href="#" data-rp="${i}">🖨 طباعة</a>`:''}${can('send')?`<a href="#" data-rs="${i}">✉ ابعت</a>`:''}${can('share')?`<a href="#" data-rc="${i}">📋 مشاركة</a>`:''}</td></tr>`).join('')}</table>
    <div class="card" style="margin-top:10px;${can('send')||can('share')?'':'display:none'}">${fromSel('rpfrom')}<b>ابعت المتعلّم على:</b>${recpBoxes('rpto')}<input id="rpsub" placeholder="عنوان الإيميل (اختياري)" style="width:100%;font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;margin:6px 0">
    ${can('send')?'<button class="pri" id="rpsend">✉ ابعت المتعلّم</button>':''} ${can('share')?'<button id="rpcopy">📋 انسخ المتعلّم (للواتساب / الإيميل)</button>':''}</div>`}
  else h+='<p class="snip">مفيش تقارير محفوظة للروتين ده لسه.</p>';
  $('#detail').innerHTML=h+'</div>';
  const paths=ix=>ix.map(i=>r.reports[+i].path);
  $('#rtrun').onclick=async()=>{const x=await post('/api/routines/run',{id});toast(x.msg,8000);setTimeout(()=>searchRoutines($('#q').value.trim(),true),1500)};
  if($('#rpall'))$('#rpall').onchange=()=>document.querySelectorAll('.rpck').forEach(c=>c.checked=$('#rpall').checked);
  document.querySelectorAll('[data-ro]').forEach(a=>a.onclick=e=>{e.preventDefault();post('/api/routines/open',{path:r.reports[+a.dataset.ro].path})});
  document.querySelectorAll('[data-rp]').forEach(a=>a.onclick=e=>{e.preventDefault();post('/api/routines/open',{path:r.reports[+a.dataset.rp].path,print:1}).then(()=>toast('اتبعت للطابعة'))});
  document.querySelectorAll('[data-rc]').forEach(a=>a.onclick=async e=>{e.preventDefault();const x=await post('/api/routines/copy',{paths:paths([a.dataset.rc])});toast(x.msg,7000)});
  document.querySelectorAll('[data-rs]').forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelectorAll('.rpck').forEach(c=>c.checked=c.value===a.dataset.rs);$('#rpsend').scrollIntoView({block:'center'});toast('اختار الإيميل ودوس ابعت')});
  if($('#rpsend'))$('#rpsend').onclick=async()=>{const ix=checked('.rpck'),to=checked('.rpto');if(!ix.length)return toast('علّم ملف واحد على الأقل');if(!to.length)return toast('اختار إيميل');
    toast('ببعت...');const x=await post('/api/routines/send',{paths:paths(ix),to,subject:$('#rpsub').value.trim(),from:$('#rpfrom')?$('#rpfrom').value:undefined});toast(x.ok?`اتبعت على ${to.join('، ')}`:'ما اتبعتش: '+x.msg,8000)};
  if($('#rpcopy'))$('#rpcopy').onclick=async()=>{const ix=checked('.rpck');if(!ix.length)return toast('علّم ملف واحد على الأقل');const x=await post('/api/routines/copy',{paths:paths(ix)});toast(x.msg,7000)};
}
function recipientsBox(){const L=(RT&&RT.recipients)||[];
  const S=(RT&&RT.senders)||[];
  $('#detail').innerHTML=`<div class="pad"><h4>📤 الإيميل اللي بيتبعت منه</h4><p class="snip">من حسابات Outlook اللي على الجهاز ده. ده الافتراضي، وتقدر تغيّره وقت الإرسال.</p>
    ${S.length?`<select id="rfrom" style="direction:ltr;min-width:260px">${S.map(e=>`<option ${e===RT.sender?'selected':''}>${esc(e)}</option>`).join('')}</select> <button id="rfsave">احفظ</button>`:'<p class="snip">مفيش حساب Outlook متضاف - ضيف الإيميل في Outlook الأول.</p>'}
    <h4>📧 الإيميلات اللي بيتبعت لها</h4><p class="snip">التقارير والملخصات بتتبعت عليهم (من الكمبيوتر أو من الموبايل).</p>
    <table>${L.map((e,i)=>`<tr><td style="direction:ltr;text-align:left">${esc(e)}</td><td><a href="#" data-rdel="${i}">شيل</a></td></tr>`).join('')||'<tr><td>مفيش لسه</td></tr>'}</table>
    <div style="display:flex;gap:6px;margin-top:8px"><input id="rnew" placeholder="name@company.com" style="direction:ltr;flex:1;font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px"><button class="pri" id="radd">ضيف</button></div></div>`;
  const save=async lst=>{const x=await post('/api/routines/recipients',{list:lst});RT.recipients=x.recipients;recipientsBox();$('#rtmail b').textContent=x.recipients.length};
  if($('#rfsave'))$('#rfsave').onclick=async()=>{const x=await post('/api/routines/recipients',{from:$('#rfrom').value});RT.sender=x.sender;toast('اتحفظ: الإرسال من '+x.sender)};
  $('#radd').onclick=()=>{const v=$('#rnew').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))return toast('اكتب إيميل صحيح');save([...L,v])};
  document.querySelectorAll('[data-rdel]').forEach(a=>a.onclick=e=>{e.preventDefault();save(L.filter((_,i)=>i!==+a.dataset.rdel))});
}
async function bnbOf(id){toast('بعمل الملخص وبعدها فورمة الـ BNB من القالب... ممكن ياخد دقيقتين',150000);
  try{const r=await post('/api/bnb',{id});toast(`اتعملت ${r.bnb} (Word + PDF) في فولدر 04 - BNB ونسخة جنب ملفات المناقصة`,10000)}catch(e){toast('الـ BNB ما اتعملتش: '+e.message,10000)}}
async function sendSummary(id){try{if(!RT)await loadRT()}catch(e){}
  const box=document.createElement('div');box.className='card';box.style.cssText='margin:10px 14px;border-color:var(--brand2)';
  box.innerHTML=`${fromSel('smfrom')}<b>✉ ابعت ملخص المناقصة على:</b>${recpBoxes('smto')}<button class="pri" id="smgo">اعمل الملخص وابعته</button>`;
  $('#detail').prepend(box);
  $('#smgo').onclick=async()=>{const to=checked('.smto');if(!to.length)return toast('اختار إيميل');toast('بعمل الملخص...',150000);
    try{const r=await post('/api/summary',{id,open:false});const x=await post('/api/summary/send',{id,path:r.path,to,from:$('#smfrom')?$('#smfrom').value:undefined});toast(x.ok?`الملخص اتبعت على ${to.join('، ')}`:'ما اتبعتش: '+x.msg,9000);box.remove()}
    catch(e){toast('خطأ: '+e.message,9000)}}}
// ---------------------------------------------------------------- البحث بصورة
const STOPW=new Set(['في','من','على','الى','إلى','عن','مع','او','أو','و','ال','هذا','هذه','التي','الذي','ذلك','تم','رقم','لسنة','بشأن','the','and','of','for','to','in','on','no']);
async function scanImage(dataUrl){$('#scanbox').style.display='flex';$('#scanbody').innerHTML=`<img src="${dataUrl}"><p class="snip">بقرا الكلام اللي في الصورة...</p>`;
  let text='';try{text=(await post('/api/ocr-image',{image:dataUrl})).text||''}catch(e){$('#scanbody').innerHTML=`<p>خطأ: ${esc(e.message)}</p>`;return}
  const words=[...new Set((text.match(/[؀-ۿA-Za-z0-9\/\-]{2,}/g)||[]).filter(w=>!STOPW.has(norm(w))))].slice(0,80);
  const lines=text.split('\n').map(x=>x.trim()).filter(x=>x.length>5).slice(0,12);
  if(!words.length){$('#scanbody').innerHTML=`<img src="${dataUrl}"><p>ملقتش كلام واضح في الصورة - جرّب صورة أوضح أو أقرب.</p>`;return}
  $('#scanbody').innerHTML=`<img src="${dataUrl}"><p class="snip">علّم الكلمات اللي تدوّر بيها (البحث بيلاقي الشبيه كمان) أو اختار سطر كامل:</p>
    <div>${words.map(w=>`<span class="w ${/\d/.test(w)||w.length>=4?'on':''}">${esc(w)}</span>`).join('')}</div>
    <p class="snip" style="margin-top:10px">أو سطر كامل:</p>${lines.map(l=>`<div class="res" data-line="${esc(l)}" style="border:1px solid var(--line);border-radius:8px;margin:4px 0">${esc(l)}</div>`).join('')}`;
  $('#scanbody').querySelectorAll('.w').forEach(w=>w.onclick=()=>w.classList.toggle('on'));
  $('#scanbody').querySelectorAll('[data-line]').forEach(l=>l.onclick=()=>{$('#q').value=SCANQ=l.dataset.line;$('#scanbox').style.display='none';search()});
}
$('#scango').onclick=()=>{const w=[...document.querySelectorAll('#scanbody .w.on')].map(x=>x.textContent);if(!w.length)return toast('علّم كلمة واحدة على الأقل');
  $('#q').value=SCANQ=w.join(' ');$('#scanbox').style.display='none';search()};
$('#scanall').onclick=()=>document.querySelectorAll('#scanbody .w').forEach(x=>x.classList.add('on'));
$('#scanx').onclick=()=>$('#scanbox').style.display='none';
$('#bscan').onclick=()=>$('#fscan').click();
$('#fscan').onchange=()=>{const f=$('#fscan').files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>scanImage(rd.result);rd.readAsDataURL(f);$('#fscan').value=''};
document.addEventListener('paste',e=>{const it=[...(e.clipboardData||{}).items||[]].find(x=>x.type.startsWith('image/'));if(!it)return;
  e.preventDefault();const rd=new FileReader();rd.onload=()=>scanImage(rd.result);rd.readAsDataURL(it.getAsFile())});
// ---------------------------------------------------------------- طباعة
$('#bprint').onclick=()=>{const f=FX(),tab=document.querySelector('#mode button.on').textContent;
  const parts=[tab,$('#q').value.trim()&&('بحث: '+$('#q').value.trim()),country&&CN[country],f.dfrom&&('من '+dmy(f.dfrom)),f.dto&&('لحد '+dmy(f.dto)),f.company&&('الشركة: '+f.company),f.client&&('الجهة: '+f.client)].filter(Boolean);
  $('#ptitle').innerHTML=`<b>GCC Tenders - ${esc(tab)}</b><div class="snip">${esc(parts.join(' · '))} · اتطبع ${new Date().toLocaleString('en-GB')}</div>`;window.print()};
// ---------------------------------------------------------------- filter bar wiring
['#fdfrom','#fdto','#fsort','#fdby'].forEach(s=>$(s).onchange=()=>{fxCount();search()});
['#fco','#fcl'].forEach(s=>$(s).addEventListener('input',()=>{fxCount();clearTimeout(deb);deb=setTimeout(search,500)}));
document.querySelectorAll('[data-qd]').forEach(b=>b.onclick=()=>{setPeriod(b.dataset.qd);fxCount()});
$('#fclear').onclick=()=>{['#fdfrom','#fdto','#fco','#fcl'].forEach(s=>$(s).value='');$('#fsort').value='';$('#fdby').value='';fxCount();search()};
boot();
</script>
</body>
