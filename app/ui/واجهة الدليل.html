<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCC Tenders</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--panel:#fff;--ink:#0f1b2d;--muted:#5d6878;--line:#e2e7ef;--brand:#0b2a4a;--brand2:#0e7c86;--soft:#e3f2f3;--fz:#fff36b;--ok:#1d7a46;--warn:#b3261e;--new:#e8f0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif}
header{background:linear-gradient(135deg,#0b2a4a,#123b63);color:#fff;padding:10px 20px;box-shadow:0 2px 10px rgba(11,42,74,.25);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header .stat{font-size:12.5px;opacity:.92}
header .sp{flex:1}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--brand2)}
button.pri{background:var(--brand2);border-color:var(--brand2);color:#fff}
header button{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.ctry{display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:10px;overflow:hidden}
.ctry button{border:0;border-radius:0;background:transparent;color:#fff;padding:6px 13px}
.ctry button.on{background:#fff;color:var(--brand);font-weight:700}
.bar{padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar input[type=search]{flex:1;min-width:260px;font:inherit;font-size:16px;padding:9px 14px;border:1.5px solid var(--line);border-radius:10px;outline:none}
.bar input[type=search]:focus{border-color:var(--brand2)}
select,.bar input[list]{font:inherit;padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 13px}
.seg button.on{background:var(--soft);color:var(--brand);font-weight:700}
.chips{padding:8px 20px 0;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.chip.fresh{border-color:#2e6aa3;color:#1f4f85}
.chip.fresh.on{background:#2e6aa3;color:#fff}
.chip b{margin-inline-start:4px}
main{display:grid;grid-template-columns:minmax(360px,44%) 1fr;gap:14px;padding:12px 20px;height:calc(100vh - 170px)}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:0 1px 2px rgba(15,27,45,.06),0 4px 14px rgba(15,27,45,.06)}
.col h3{margin:0;padding:10px 14px;font-size:14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.res{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.res:hover{background:#f7fafd}
.res.sel{background:var(--soft);border-right:4px solid var(--brand2)}
.res.unread{background:#fff4d6;border-right:4px solid #f59e0b}.res.unread.sel{background:#ffe9b0}
.bdg{display:inline-block;min-width:18px;background:#e5484d;color:#fff;border-radius:20px;font-size:11px;line-height:17px;padding:0 6px;margin-inline-start:6px;font-weight:700;text-align:center}
.bdg:empty{display:none}
.wk{font-size:11px;border-radius:20px;padding:0 8px;background:#e8eef6;color:#26476e;font-weight:700}
.wk.us{background:var(--fz);color:#5a4b00}
.mail{white-space:pre-wrap;font-size:13px;background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:420px;overflow:auto}
.res .t{font-weight:600}
.m{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;align-items:center}
.tno{direction:ltr;unicode-bidi:isolate;display:inline-block;background:#f0f3f7;border-radius:5px;padding:0 6px;font-size:12.5px}
.st{display:inline-block;font-size:11.5px;padding:0 8px;border-radius:20px;font-weight:600}
.st-open{background:#d7f0e0;color:#12613a}.st-soon{background:#fde8c8;color:#8a4b00}.st-study{background:#e6ebf2;color:#34465c}
.st-award{background:#dde7fb;color:#1f3f8a}.st-cancel{background:#fbdcdc;color:#8a1f1f}.st-run{background:#efe3fb;color:#5b2a86}
.flag{font-size:11px;border-radius:20px;padding:0 7px;font-weight:700}
.flag-new{background:#2e6aa3;color:#fff}.flag-chg{background:#ffd8a8;color:#7a3e00}
.cc{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:0 6px}
.off{font-size:12px;font-weight:700;color:#0b5aa5;text-decoration:none;border:1px solid #bcd3ee;border-radius:6px;padding:0 6px;background:#f1f7fe}
.off:hover{background:#e0eefc}
.urgent{color:var(--warn);font-weight:700}
.fz{background:var(--fz);padding:0 4px;border-radius:4px}
.fzb{background:var(--fz);color:#5a4b00;font-size:11px;border-radius:20px;padding:0 7px}
.money{font-weight:700;color:var(--ok)}
.pad{padding:14px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px}
.kv div:nth-child(odd){color:var(--muted)}
h4{margin:14px 0 6px;font-size:14px;color:var(--brand)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:right;vertical-align:top}
th{background:#f3f6fa}
tr.chg td{background:#fff7ec}
.hit{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;gap:10px}
.badge{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:20px;background:#eef2f6;margin-inline-start:6px}
.snip{color:var(--muted);font-size:12px;margin-top:3px;max-height:3.2em;overflow:hidden}
.actions{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);padding:30px;text-align:center}
.log{font-size:12px;white-space:pre-wrap;background:#0f1a24;color:#cfe3f5;border-radius:8px;padding:8px;max-height:150px;overflow:auto;margin:8px 20px 0}
a{color:#0b5aa5}
.only-items,.only-awards{display:contents}
#modal{position:fixed;inset:0;background:rgba(10,20,30,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:5}
#modal img{max-width:min(900px,96vw);background:#fff;border-radius:6px}
#toast{position:fixed;bottom:18px;left:18px;background:#1d2733;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:6;max-width:460px}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto}}
</style>
</head>
<body>
<header>
  <h1 style="direction:ltr">GCC Tenders</h1><span class="stat" style="opacity:.75">مناقصات ومشاريع الخليج</span>
  <div class="ctry" id="ctry"><button data-c="" class="on">الكل</button><button data-c="KW">الكويت</button><button data-c="SA">السعودية</button><button data-c="AE">الإمارات</button></div>
  <span class="stat" id="stat">...</span>
  <span class="sp"></span>
  <label class="stat" title="البرنامج بيجيب الجديد من المواقع لوحده طول ما هو شغال (حتى لو النافذة مقفولة)">تحديث تلقائي
    <select id="auto" style="color:var(--ink)"><option value="5">كل 5 دقايق</option><option value="15">كل ربع ساعة</option><option value="30">كل نص ساعة</option><option value="60">كل ساعة</option><option value="360">كل 6 ساعات</option><option value="0">مقفول</option></select></label>
  <button id="btnUpdate" title="يجيب الجديد من المواقع دلوقتي">تحديث دلوقتي</button>
  <button onclick="post('/api/open-folder')">فولدر التقارير</button>
</header>
<div class="bar">
  <div class="seg" id="mode"><button data-m="items" class="on">المناقصات والمشاريع</button><button data-m="news">الأخبار</button><button data-m="awards">ترسيات ومحاضر الكويت</button><button data-m="watch">متابعة فواز و KJAC</button></div>
  <input type="search" id="q" placeholder="اكتب عنوان المناقصة أو المشروع أو رقمها أو الجهة ... (فاضي = المطروح بترتيب الإقفال)" autofocus>
  <span class="only-items">
    <select id="cat"><option value="">كل أنواع الشغل</option></select>
    <input list="orgs" id="org" placeholder="الجهة"><datalist id="orgs"></datalist>
    <select id="days"><option value="0">أي موعد إقفال</option><option value="7">بيقفل خلال أسبوع</option><option value="14">خلال أسبوعين</option><option value="30">خلال شهر</option></select>
    <label><input type="checkbox" id="fawaz"> نطاق فواز</label>
  </span>
  <span class="only-awards" style="display:none"><select id="ayear"><option value="">كل السنين</option></select><label><input type="checkbox" id="amin"> بحث مباشر في المحاضر</label><button onclick="post('/api/open-excel')">افتح إكسيل الترسيات</button></span>
  <button class="pri" id="go">بحث</button>
</div>
<div class="chips" id="chips"></div>
<pre class="log" id="log" style="display:none"></pre>
<main>
  <section class="col"><h3 id="lh">النتائج</h3><div id="results"><div class="empty">بحمّل...</div></div></section>
  <section class="col"><h3>التفاصيل</h3><div id="detail"><div class="empty">اختار مناقصة أو مشروع</div></div></section>
</main>
<div id="modal" onclick="this.style.display='none'"><img id="mimg" alt=""></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const isFz=s=>/فواز|fawaz/i.test(s||'');
const today=new Date().toISOString().slice(0,10);
const CN={KW:'الكويت',SA:'السعودية',AE:'الإمارات'};
let mode='items',status='',fresh=0,country='',current=null,hits=[],lastQ='';
const STATUSES=['مطروحة','اتوافق على طرحها','إعلان مسبق','مقفولة - تحت الدراسة','أسعار معلنة','مترسية','عقد جاري (قرار الجهاز)','ملغاة'];
function stClass(s,closing){if(s==='مطروحة'){const d=(new Date(closing)-new Date(today))/864e5;return d<=7?'st-soon':'st-open'}
  return {'مترسية':'st-award','ملغاة':'st-cancel','عقد جاري (قرار الجهاز)':'st-run','اتوافق على طرحها':'st-soon','إعلان مسبق':'st-soon'}[s]||'st-study'}
function toast(m,ms=4000){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms)}
async function get(u){const r=await fetch(u);const j=await r.json();if(j&&j.error)throw new Error(j.error);return j}
async function post(u,b={}){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(j&&j.error)throw new Error(j.error);return j}
// official page of the announcement (Dubai eSupply needs its guest session first)
function openOfficial(url){
  if(!url)return;
  if(url.includes('esupply.dubai.gov.ae')){const w=window.open('https://esupply.dubai.gov.ae/esop/guest/go/public/opportunity/current','_blank');
    setTimeout(()=>{try{w.location=url}catch(e){}},2500);return}
  window.open(url,'_blank');
}
function offLink(r){return r.official?`<a class="off" href="#" data-off="${esc(r.official)}" title="${esc(r.official_label||'')}">الإعلان الرسمي ↗</a>`:''}
function wireOff(root){(root||document).querySelectorAll('[data-off]').forEach(a=>a.onclick=e=>{e.preventDefault();e.stopPropagation();openOfficial(a.dataset.off)})}
function isNew(r){return r.first_seen&&(Date.now()-new Date(r.first_seen))<3*864e5}
function isChg(r){return r.changed&&(Date.now()-new Date(r.changed))<3*864e5}
async function status_(first){
  try{const s=await get('/api/status?country='+country);
    const lr=s.last_run&&s.last_run.finished?(' · آخر تحديث '+s.last_run.finished.replace('T',' ').slice(0,16)):' · لسه متحدّثش';
    const nx=s.next?(' · الجاي تلقائي '+s.next.replace('T',' ').slice(5,16)):'';
    $('#stat').textContent=`${s.total.toLocaleString('en')} مناقصة ومشروع · ${s.news.toLocaleString('en')} خبر · ${s.closing_week} بتقفل خلال أسبوع${lr}${nx}`;
    if(first){s.cats.forEach(c=>$('#cat').insertAdjacentHTML('beforeend',`<option>${c}</option>`));
      for(let y=new Date().getFullYear();y>=2006;y--)$('#ayear').insertAdjacentHTML('beforeend',`<option>${y}</option>`);}
    $('#orgs').innerHTML=s.orgs.map(o=>`<option value="${esc(o)}">`).join('');
    document.querySelectorAll('#ctry button').forEach(b=>{const n=b.dataset.c?(s.countries[b.dataset.c]||0):Object.values(s.countries).reduce((a,b)=>a+b,0);b.textContent=(b.dataset.c?CN[b.dataset.c]:'الكل')+' ('+n.toLocaleString('en')+')'});
    if(mode!=='watch')$('#chips').innerHTML=mode!=='items'?'':`<span class="chip fresh ${fresh?'on':''}" data-f="1">المستجدات (آخر 3 أيام)<b>${s.fresh}</b></span><span class="chip ${status||fresh?'':'on'}" data-s="">الكل<b>${s.total}</b></span>`+STATUSES.filter(x=>s.status[x]).map(x=>`<span class="chip ${status===x?'on':''}" data-s="${x}">${x}<b>${s.status[x]}</b></span>`).join('');
    document.querySelectorAll('.chip[data-s]').forEach(c=>c.onclick=()=>{status=c.dataset.s;fresh=0;status_();search()});
    document.querySelectorAll('.chip[data-f]').forEach(c=>c.onclick=()=>{fresh=fresh?0:3;status='';status_();search()});
    updateBadges(s);
    if(document.activeElement!==$('#auto'))$('#auto').value=String(s.auto_minutes??5);
    // the log shows while an update runs (or after one that failed), then hides again
    if(s.update==='running'||s.update==='error'){$('#log').style.display='block';$('#log').textContent=s.log.join('\n');$('#log').scrollTop=1e9}
    else $('#log').style.display='none';
    if(s.update==='running'){$('#btnUpdate').textContent='جاري التحديث...';clearTimeout(window._st);window._st=setTimeout(status_,3000)}
    else $('#btnUpdate').textContent='تحديث دلوقتي';
    // every finished update (automatic or manual) refreshes what is on screen by itself
    const fin=s.last_run&&s.last_run.finished||'';
    if(window._fin!==undefined&&fin!==window._fin&&mode!=='awards')search(true)
    window._fin=fin;
  }catch(e){$('#stat').textContent='البرنامج مش شغال - افتحه من الأيقونة'}
}
setInterval(()=>status_(),30000);
$('#btnUpdate').onclick=async()=>{await post('/api/update');toast('بدأ التحديث - بياخد كام دقيقة');status_()};
$('#auto').onchange=async()=>{const v=+$('#auto').value;await post('/api/settings',{auto_update_minutes:v});
  toast(v?`التحديث التلقائي بقى ${$('#auto').selectedOptions[0].textContent}`:'التحديث التلقائي اتقفل');status_()};
document.querySelectorAll('#ctry button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#ctry button').forEach(x=>x.classList.toggle('on',x===b));country=b.dataset.c;status='';status_();search()});
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));mode=b.dataset.m;
  openTab(mode);
  $('.only-items').style.display=mode==='awards'||mode==='watch'?'none':'contents';$('.only-awards').style.display=mode==='awards'?'contents':'none';status_();search()});
let deb;$('#q').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(search,450)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
$('#go').onclick=search;['#cat','#days','#fawaz','#org','#ayear','#amin'].forEach(s=>$(s).onchange=search);

async function search(keep){
  // keep=true: silent refresh after an automatic update - same list place, same selection
  if(keep instanceof Event)keep=false;
  const q=$('#q').value.trim();lastQ=q;if(!keep)$('#results').innerHTML='<div class="empty">بدوّر...</div>';
  const top=$('#results').parentElement.scrollTop;
  try{
    if(mode==='news')return searchNews(q);
    if(mode==='awards')return searchAwards(q);
    if(mode==='watch')return searchWatch(q,keep);
    const p=new URLSearchParams({q,status,country,fresh,cat:$('#cat').value,org:$('#org').value,days:$('#days').value,fawaz:$('#fawaz').checked?1:0});
    const res=await get('/api/search?'+p);if(q!==lastQ)return;
    $('#lh').textContent=`النتائج (${res.length}${res.length>=250?'+':''})`;
    $('#results').innerHTML=res.length?res.map(r=>{
      const left=r.status==='مطروحة'&&r.closing?Math.round((new Date(r.closing)-new Date(today))/864e5):null;
      return `<div class="res ${isUnread(r)?'unread':''}" data-id="${r.id}"><div class="t">${esc(r.subject)}</div>
      <div class="m"><span class="st ${stClass(r.status,r.closing)}">${esc(r.status)}</span>${isNew(r)?'<span class="flag flag-new">جديد</span>':isChg(r)?'<span class="flag flag-chg">اتغيّر</span>':''}
        ${country?'':`<span class="cc">${CN[r.country]||r.country}</span>`}${r.number?`<span class="tno">${esc(r.number)}</span>`:''}<span>${esc(r.org)}</span>${r.fawaz?'<span class="fzb">نطاق فواز</span>':''}</div>
      <div class="m">${r.closing?`<span class="${left!==null&&left<=7?'urgent':''}">إقفال ${dmy(r.closing)}${left!==null?` (باقي ${left} يوم)`:''}</span>`:''}
      ${r.winner?`<span class="${isFz(r.winner)?'fz':''}">${esc(r.winner.slice(0,70))}</span>`:''}${r.value?`<span class="money">${esc(r.value)}</span>`:''}${offLink(r)}</div></div>`}).join(''):'<div class="empty">مفيش نتائج - جرّب كلمات أقل أو شيل الفلاتر</div>';
    wireOff($('#results'));
    document.querySelectorAll('.res[data-id]').forEach(el=>el.onclick=()=>{document.querySelectorAll('.res').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');detail(+el.dataset.id)});
    if(keep){const s=current&&current.id&&document.querySelector(`.res[data-id="${current.id}"]`);if(s)s.classList.add('sel');$('#results').parentElement.scrollTop=top;return}
    if(q){const f=document.querySelector('.res[data-id]');if(f)f.click()}
  }catch(e){$('#results').innerHTML=`<div class="empty">خطأ: ${esc(e.message)}</div>`}
}
async function searchNews(q){
  const res=await get(`/api/news?q=${encodeURIComponent(q)}&country=${country}&fawaz=${$('#fawaz').checked?1:0}`);
  $('#lh').textContent=`الأخبار (${res.length})`;
  $('#results').innerHTML=res.length?res.map(n=>`<div class="res ${n.seen_at&&n.seen_at>HL.news?'unread':''}"><div class="t"><a href="#" data-off="${esc(n.url)}">${esc(n.title)}</a></div>
    <div class="m"><span>${dmy(n.date)}</span>${country?'':`<span class="cc">${CN[n.country]||''}</span>`}<span>${esc(n.source)}</span><span>${esc(n.cats)}</span>${n.fawaz?'<span class="fzb">نطاق فواز</span>':''}</div>
    ${n.summary?`<div class="snip">${esc(n.summary)}</div>`:''}</div>`).join(''):'<div class="empty">مفيش أخبار</div>';
  wireOff($('#results'));$('#detail').innerHTML='<div class="empty">دوس على عنوان الخبر يفتحه في المتصفح</div>';
}
function hitsHtml(list,checkAll){return list.map((x,i)=>`<label class="hit"><input type="checkbox" data-i="${i}" ${checkAll||x.score>=0.6?'checked':''}>
  <div style="flex:1"><div><b>محضر ${x.year}/${x.meeting||'?'} · ${dmy(x.mdate)}</b>${x.type?`<span class="badge">${esc(x.type)}</span>`:''}${x.award_meeting?'<span class="badge" style="background:#d7f0e0">اجتماع الترسية</span>':''}<span class="badge">تطابق ${Math.round(Math.min(x.score,1)*100)}%</span></div>
  <div class="m">${esc(x.file.split('\\').pop())} · صفحة ${x.page} · <a href="#" data-prev="${i}">معاينة</a></div><div class="snip">${esc(x.snippet)}</div></div></label>`).join('')}
function wirePrev(){document.querySelectorAll('[data-prev]').forEach(a=>a.onclick=e=>{e.preventDefault();const x=hits[+a.dataset.prev];$('#mimg').src=`/api/page.png?file=${encodeURIComponent(x.file)}&page=${x.page}`;$('#modal').style.display='flex'})}
async function searchAwards(q){

// ---------------------------------------------------------------- unread badges
// HL = the "read up to here" point of each tab when it was opened: newer rows stay coloured while
// you are on the tab; the server marker moves on so the badge clears.
let HL={},SEEN={},UN={};
function isUnread(r){return (r.first_seen&&!r.first_seen.startsWith('2000')&&r.first_seen>(HL.items||'~'))||(r.changed&&r.changed>(HL.items||'~'))}
function updateBadges(s){
  SEEN=s.seen||{};UN=s.unread||{};
  document.querySelectorAll('#mode button').forEach(b=>{let x=b.querySelector('.bdg');if(!x){x=document.createElement('span');x.className='bdg';b.appendChild(x)}
    const n=b.dataset.m===mode?0:(UN[b.dataset.m]||0);x.textContent=n?(n>999?'999+':n):''});
  if(HL[mode]===undefined)openTab(mode,true);
  else if(UN[mode]&&!document.hidden)post('/api/seen',{tab:mode}).catch(()=>{});
  const tot=Object.entries(UN).filter(([k])=>k!==mode).reduce((a,[,v])=>a+(v||0),0);
  document.title=(tot?`(${tot}) `:'')+'دليل مناقصات الخليج';
}
function openTab(tab,noSearch){
  if(SEEN[tab]===undefined)return;
  HL[tab]=SEEN[tab];if(tab==='awards')HL.awardsNew=UN.awards||0;if(tab==='watch')HL.watch=+SEEN.watch||0;
  post('/api/seen',{tab}).catch(()=>{});
}

}
const DUR=[[1,'شهر'],[3,'3 شهور'],[6,'6 شهور'],[12,'سنة'],[0,'من غير مدة']];
function permBoxes(d,cur,cc,pre){return `<div style="display:flex;gap:10px;flex-wrap:wrap;margin:6px 0">${Object.entries(d.features).map(([k,l])=>`<label><input type="checkbox" class="${pre}-p" value="${k}" ${cur.includes(k)?'checked':''}> ${l}</label>`).join('')}</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">${Object.entries(d.countries).map(([k,l])=>`<label><input type="checkbox" class="${pre}-c" value="${k}" ${cc.includes(k)?'checked':''}> ${l}</label>`).join('')}</div>`}
const checked=sel=>[...document.querySelectorAll(sel+':checked')].map(x=>x.value);
async function accountsBox(body){
  let d;try{d=await post('/api/accounts',body||{action:'list'})}catch(e){$('#detail').innerHTML=`<div class="empty">خطأ: ${esc(e.message)}</div>`;return}
  if(d.msg)toast(d.msg,6000);
  const ago=s=>s?s.replace('T',' '):'لسه مفتحش';
  const left=x=>{if(!x.expires)return 'من غير مدة';const n=Math.round((new Date(x.expires)-new Date(d.today))/864e5);return `${dmy(x.expires)}${n<0?' (انتهى)':n<=7?` (باقي ${n} يوم)`:''}`};
  const state=x=>!x.active?'<span class="st st-cancel">متوقف</span>':!x.live?'<span class="st st-cancel">الاشتراك انتهى</span>':'<span class="st st-open">شغال</span>';
  const short={dir:'الدليل',news:'الأخبار',awards:'الترسيات',watch:'فواز',fawaz:'السرية'};
  let h=`<div class="pad">`;
  if(d.new)h+=`<div class="card" style="border-color:#16806b;background:#e7f4f0"><b>بيانات الدخول (بتظهر مرة واحدة - ابعتها للمشترك):</b>
    <div class="kv" style="margin-top:6px"><div>اسم المستخدم</div><div><b style="direction:ltr;unicode-bidi:isolate">${esc(d.new.u)}</b></div><div>كلمة السر</div><div><b style="direction:ltr;unicode-bidi:isolate;font-size:17px">${esc(d.new.pw)}</b></div>
    <div>رابط التطبيق</div><div><a href="#" data-off="${esc(d.site)}">${esc(d.site)}</a></div></div>
    <button id="ac-mail" style="margin-top:8px">ابعتها على الجيميل بتاعي</button></div>`;
  h+=`<div class="card"><b>حسابك</b><div class="kv" style="margin-top:6px"><div>اسم المستخدم</div><div><b style="direction:ltr;unicode-bidi:isolate">${esc(d.owner)}</b></div>
    <div>كلمة السر</div><div><b style="direction:ltr;unicode-bidi:isolate;font-size:17px">${esc(d.owner_password)}</b></div></div>
    <p class="snip">على الموبايل ادخل بيهم مرة، وبعد كده تقدر تدخل بالبصمة. لو نسيتها هناك، دوس "نسيت كلمة السر" وهتوصلك واحدة جديدة على ${esc(d.email)} (والكمبيوتر شغال).</p></div>
  <div class="card"><b>مشترك جديد</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center">
    <input id="ac-name" placeholder="اسم المستخدم (إنجليزي) مثلاً mohamed" style="direction:ltr;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;min-width:220px">
    <label>المدة <select id="ac-dur">${DUR.map(([m,l])=>`<option value="${m}" ${m===1?'selected':''}>${l}</option>`).join('')}</select></label></div>
    ${permBoxes(d,['dir','news','awards','watch'],Object.keys(d.countries),'ac')}
    <button class="pri" id="ac-add" style="margin-top:8px">اعمل الحساب</button></div>
  <h4>المشتركين (${d.users.length})</h4><table><tr><th>المستخدم</th><th>الحالة</th><th>لحد</th><th>يستخدم</th><th>آخر فتح</th><th>مرات</th><th></th></tr>
  ${d.users.map(x=>`<tr><td><b style="direction:ltr;unicode-bidi:isolate">${esc(x.u)}</b>${x.admin?' <span class="badge">إنت</span>':''}${x.forgot?` <span class="badge" style="background:#fde8c8">نسي كلمة السر ${esc(x.forgot.replace('T',' '))}</span>`:''}</td>
    <td>${state(x)}</td><td>${esc(left(x))}</td><td style="font-size:12px">${x.perms.map(p=>short[p]||p).join('، ')}<br>${x.countries.map(c=>d.countries[c]).join('، ')}</td>
    <td>${esc(ago(x.last_seen))}</td><td>${x.opens||0}</td>
    <td style="white-space:nowrap">${x.admin?'':`<select data-ext="${esc(x.u)}"><option value="">تمديد...</option>${DUR.map(([m,l])=>`<option value="${m}">${m?'+ '+l:'من غير مدة'}</option>`).join('')}</select>
      <button data-perm="${esc(x.u)}">الصلاحيات</button>
      <button data-ac="active" data-u="${esc(x.u)}" data-v="${x.active?0:1}">${x.active?'إيقاف':'تفعيل'}</button>`}
      <button data-ac="reset" data-u="${esc(x.u)}">كلمة سر جديدة</button>${x.admin?'':` <button data-ac="delete" data-u="${esc(x.u)}">مسح</button>`}</td></tr>
    <tr id="pe-${esc(x.u)}" style="display:none"><td colspan="7">${permBoxes(d,x.perms,x.countries,'pe-'+x.u)}<button class="pri" data-psave="${esc(x.u)}" style="margin-top:6px">احفظ الصلاحيات</button></td></tr>`).join('')}</table>
  <p class="snip">أي تغيير بيتنشر على الموبايل خلال دقيقة. اللي اشتراكه انتهى أو اتوقف مش بيقدر يفتح أي داتا جديدة، والتطبيق بيمسح اللي عنده (الانتهاء بيتطبّق لوحده حتى لو الكمبيوتر مقفول). اللي مش مسموحله بجزء، الجزء ده بيتشفّر بمفتاح مبيوصلوش.</p></div>`;
  $('#detail').innerHTML=h;wireOff($('#detail'));
  if($('#ac-mail'))$('#ac-mail').onclick=()=>accountsBox({action:'mail',u:d.new.u,pw:d.new.pw});
  $('#ac-add').onclick=()=>{const n=$('#ac-name').value.trim();if(!n)return toast('اكتب اسم المستخدم');
    accountsBox({action:'add',name:n,months:+$('#ac-dur').value,perms:checked('.ac-p'),countries:checked('.ac-c')})};
  document.querySelectorAll('[data-ext]').forEach(s=>s.onchange=()=>{if(s.value==='')return;accountsBox({action:'extend',u:s.dataset.ext,months:+s.value})});
  document.querySelectorAll('[data-perm]').forEach(b=>b.onclick=()=>{const r=document.getElementById('pe-'+b.dataset.perm);r.style.display=r.style.display==='none'?'':'none'});
  document.querySelectorAll('[data-psave]').forEach(b=>b.onclick=()=>{const u=b.dataset.psave;
    accountsBox({action:'perms',u,perms:checked('.pe-'+CSS.escape(u)+'-p'),countries:checked('.pe-'+CSS.escape(u)+'-c')})});
  document.querySelectorAll('[data-ac]').forEach(b=>b.onclick=()=>{const a=b.dataset.ac,u=b.dataset.u;
    if(a==='delete'&&!confirm(`تمسح حساب ${u} نهائي؟`))return;
    if(a==='reset'&&!confirm(`كلمة السر القديمة لـ ${u} هتبطل تشتغل. تكمّل؟`))return;
    accountsBox({action:a,u,value:b.dataset.v==='1'})});
}
function sel(el){document.querySelectorAll('.res').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}
function norm(s){return String(s||'').normalize('NFKC').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).toLowerCase()}
function digits(s){return norm(s).match(/\d+/g)||[]}
function tenderDetail(key){
  const t=W.tenders.find(x=>x.key===key);if(!t){$('#detail').innerHTML='<div class="empty">مش لاقيها</div>';return}
  const feed=W.feed.filter(f=>f.tender_key===key);
  let h=`<div class="pad"><div class="card"><div class="kv"><div>المناقصة</div><div><b>${esc(t.title)}</b></div><div>العميل</div><div>${esc(t.client)}</div>
    ${t.number?`<div>الرقم</div><div><span class="tno">${esc(t.number)}</span></div>`:''}${t.closing?`<div>الإقفال</div><div>${dmy(t.closing)}</div>`:''}
    <div>المصدر</div><div>${esc(t.src)}</div>${t.status?`<div>الحالة</div><div>${esc(t.status)}</div>`:''}${t.remarks?`<div>ملاحظات</div><div>${esc(t.remarks)}</div>`:''}
    ${t.fawaz_rank?`<div>ترتيبنا</div><div><span class="fzb">L${t.fawaz_rank}</span></div>`:''}</div></div>`;
  if(t.bidders.length)h+=`<h4>الأسعار (L1 ...)</h4><table><tr><th>#</th><th>الشركة</th><th>السعر</th></tr>${t.bidders.map((b,i)=>`<tr><td>L${i+1}</td><td class="${isFz(b[0])?'fz':''}">${esc(b[0])}</td><td>${esc(b[1])}</td></tr>`).join('')}</table>`;
  const items=t.links.filter(l=>l.kind==='item');
  if(items.length)h+=`<h4>نفس المناقصة في الدليل</h4>${items.map(l=>`<div class="m"><a href="#" data-item="${esc(l.ref)}">${esc(l.title)}</a>${l.url?`<a class="off" href="#" data-off="${esc(l.url)}">الإعلان الرسمي ↗</a>`:''}</div>`).join('')}`;
  if(feed.length)h+=`<h4>كل اللي اترصد عنها (${feed.length})</h4>${feed.map(f=>`<div class="hit"><div style="flex:1"><div class="m"><span class="wk">${esc(f.kind)}</span><span>${f.at.startsWith('2000')?'من أول تحميل':esc(f.at.replace('T',' ').slice(0,16))}</span></div><div>${esc(f.text)}${f.url?` <a href="#" data-off="${esc(f.url)}">↗</a>`:''}</div></div></div>`).join('')}`;
  h+='</div>';$('#detail').innerHTML=h;wireOff($('#detail'));
  document.querySelectorAll('[data-item]').forEach(a=>a.onclick=e=>{e.preventDefault();detail(+a.dataset.item)});
}
function mailDetail(e){
  $('#detail').innerHTML=`<div class="pad"><div class="card"><div class="kv"><div>الموضوع</div><div><b>${esc(e.subject)}</b></div><div>من</div><div>${esc(e.sender)}</div><div>وصل</div><div>${esc(e.received.replace('T',' '))}</div></div></div>
    <div class="mail">${esc(e.body)}</div></div>${e.attachment?`<div class="actions"><button class="pri" id="opa">افتح ملف الإكسيل المرفق</button></div>`:''}`;
  if(e.attachment)$('#opa').onclick=()=>post('/api/open-file',{path:e.attachment}).catch(x=>toast('خطأ: '+x.message));
}
status_(true).then(search);
</script>
</body>
</html>
