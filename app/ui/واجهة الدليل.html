<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCC Tenders</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f9;--panel:#fff;--ink:#16213a;--muted:#5f6b7f;--line:#e2e7f0;--brand:#14325c;--brand2:#e07a1f;--brand3:#2563a8;--soft:#fff2e5;--soft2:#eaf1fb;--fz:#ffe873;--ok:#18794e;--warn:#c2410c;--new:#eaf1fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif}
html,body{height:100%}
body{display:flex;flex-direction:column}
header{background:linear-gradient(120deg,#102a4f 0%,#14325c 45%,#1f4f8a 100%);border-bottom:3px solid var(--brand2);color:#fff;padding:8px 20px;box-shadow:0 2px 10px rgba(11,42,74,.25);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;direction:rtl}.brand b{font-size:18px;direction:ltr;text-align:right}.brand small{font-size:11.5px;opacity:.75}
.menu{position:relative}.menu summary{list-style:none;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);font-size:16px}
.menu summary::-webkit-details-marker{display:none}
.menu .mbox{position:absolute;inset-inline-end:0;top:40px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(15,27,45,.18);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:230px;z-index:20}
.menu .mbox button{background:#fff;color:var(--ink);border-color:var(--line);text-align:start}
.menu .mbox label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.tabsbar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 20px 0;overflow-x:auto}
.tabsbar .seg{border:0;border-radius:0;gap:2px}
.tabsbar .seg button{border-radius:10px 10px 0 0;padding:8px 14px;white-space:nowrap;color:var(--muted)}
.tabsbar .seg button.on{background:var(--bg);color:var(--brand);border-bottom:3px solid var(--brand2)}
.sbox{flex:1;display:flex;min-width:280px;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.sbox:focus-within{border-color:var(--brand2)}
.sbox input{flex:1;border:0;outline:none;font:inherit;font-size:15px;padding:9px 14px;min-width:0}
.sbox .pri{border-radius:0;box-shadow:none;padding:0 18px}
.ib{height:38px;min-width:38px;padding:0 11px;border-radius:10px;font-size:15px;white-space:nowrap}
.ib.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap}
.stat2{color:var(--muted);font-size:12px;width:100%;order:9}
.fpanel{display:none;background:#fbfcfe;border-bottom:1px solid var(--line);padding:10px 20px}
.fpanel.open{display:block}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 12px;align-items:end}
.fgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.fgrid label.chk{flex-direction:row;color:var(--ink);font-size:13px;padding-bottom:7px}
.fgrid input:not([type=checkbox]),.fgrid select{font:inherit;font-size:13.5px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%;max-width:none}
.fpanel .qd{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.fpanel .qd button{padding:3px 11px;border-radius:20px;font-size:12.5px}.fpanel .qd .sp{flex:1}
header h1{font-size:18px;margin:0}
header .stat{font-size:12.5px;opacity:.92}
header .sp{flex:1}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--brand2);color:var(--brand2)}
button.pri{background:var(--brand2);border-color:var(--brand2);color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(224,122,31,.28)}
button.pri:hover{background:#c96a14;color:#fff}
header button{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.ctry{display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:10px;overflow:hidden}
.ctry button{border:0;border-radius:0;background:transparent;color:#fff;padding:6px 13px}
.ctry button.on{background:#fff;color:var(--brand);font-weight:700}
.bar{padding:10px 20px 6px;background:var(--bg);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar input[type=search]{flex:1;min-width:260px;font:inherit;font-size:16px;padding:9px 14px;border:1.5px solid var(--line);border-radius:10px;outline:none}
.bar input[type=search]:focus{border-color:var(--brand2)}
select,.bar input[list]{font:inherit;padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 13px}
.seg button.on{background:var(--brand);color:#fff;font-weight:700}
.chips{padding:8px 20px 0;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.chip.fresh{border-color:var(--brand3);color:var(--brand3)}
.chip.fresh.on{background:var(--brand3);color:#fff}
.chip b{margin-inline-start:4px}
main{display:grid;grid-template-columns:minmax(360px,44%) 1fr;gap:14px;padding:12px 20px;flex:1;min-height:0}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:0 1px 2px rgba(15,27,45,.06),0 4px 14px rgba(15,27,45,.06)}
.col h3{margin:0;padding:10px 14px;font-size:14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.res{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.res:hover{background:var(--soft2)}
.res.sel{background:var(--soft);border-right:4px solid var(--brand2)}
.res.unread{background:#fff4d6;border-right:4px solid #f59e0b}.res.unread.sel{background:#ffe9b0}
.bdg{display:inline-block;min-width:18px;background:#e5484d;color:#fff;border-radius:20px;font-size:11px;line-height:17px;padding:0 6px;margin-inline-start:6px;font-weight:700;text-align:center}
.bdg:empty{display:none}
.wk{font-size:11px;border-radius:20px;padding:0 8px;background:#e8eef6;color:#26476e;font-weight:700}
.wk.us{background:var(--fz);color:#5a4b00}
.mail{white-space:pre-wrap;font-size:13px;background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:420px;overflow:auto}
.res .t{font-weight:600}
.m{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;align-items:center}
.tno{direction:ltr;unicode-bidi:isolate;display:inline-block;background:#f0f3f7;border-radius:5px;padding:0 6px;font-size:12.5px}
.st{display:inline-block;font-size:11.5px;padding:0 8px;border-radius:20px;font-weight:600}
.st-open{background:#d7f0e0;color:#12613a}.st-soon{background:#fde8c8;color:#8a4b00}.st-study{background:#e6ebf2;color:#34465c}
.st-award{background:#dde7fb;color:#1f3f8a}.st-cancel{background:#fbdcdc;color:#8a1f1f}.st-run{background:#efe3fb;color:#5b2a86}
.flag{font-size:11px;border-radius:20px;padding:0 7px;font-weight:700}
.flag-new{background:#2e6aa3;color:#fff}.flag-chg{background:#ffd8a8;color:#7a3e00}
.cc{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:0 6px}
.off{font-size:12px;font-weight:700;color:#0b5aa5;text-decoration:none;border:1px solid #bcd3ee;border-radius:6px;padding:0 6px;background:#f1f7fe}
.off:hover{background:#e0eefc}
.urgent{color:var(--warn);font-weight:700}
.fz{background:var(--fz);padding:0 4px;border-radius:4px}
.fzb{background:var(--fz);color:#5a4b00;font-size:11px;border-radius:20px;padding:0 7px}
.money{font-weight:700;color:var(--ok)}
.pad{padding:14px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px}
.kv div:nth-child(odd){color:var(--muted)}
h4{margin:14px 0 6px;font-size:14px;color:var(--brand);border-right:3px solid var(--brand2);padding-right:7px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:right;vertical-align:top}
th{background:var(--soft2);color:var(--brand)}
tr.chg td{background:#fff7ec}
.hit{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;gap:10px}
.badge{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:20px;background:#eef2f6;margin-inline-start:6px}
.snip{color:var(--muted);font-size:12px;margin-top:3px;max-height:3.2em;overflow:hidden}
.actions{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);padding:30px;text-align:center}
.log{font-size:12px;white-space:pre-wrap;background:#0f1a24;color:#cfe3f5;border-radius:8px;padding:8px;max-height:150px;overflow:auto;margin:8px 20px 0}
a{color:#0b5aa5}
.only-items,.only-awards{display:contents}
#modal{position:fixed;inset:0;background:rgba(10,20,30,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:5}
#modal img{max-width:min(900px,96vw);background:#fff;border-radius:6px}
#toast{position:fixed;bottom:18px;left:18px;background:#1d2733;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:6;max-width:460px}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto;flex:none}body{display:block}}
#login{position:fixed;inset:0;background:linear-gradient(120deg,#102a4f 0%,#14325c 45%,#1f4f8a 100%);display:none;align-items:center;justify-content:center;z-index:50}
#login .box{background:#fff;border-radius:14px;padding:26px 28px;width:340px;max-width:calc(100vw - 32px);box-shadow:0 10px 40px rgba(0,0,0,.3)}
#login h2{margin:0 0 4px;direction:ltr;text-align:center;color:var(--brand)}
#login p{margin:0 0 16px;text-align:center;color:var(--muted);font-size:13px}
#login input[type=text],#login input[type=password]{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;direction:ltr}
#login button.pri{width:100%;padding:9px;margin-top:6px}
#login .err{color:var(--warn);font-size:13px;min-height:20px;text-align:center;margin-top:8px}
#login a{font-size:12.5px;color:var(--brand2)}
.me{font-size:12.5px;background:rgba(255,255,255,.14);border-radius:8px;padding:3px 10px}
.fbar{padding:8px 20px;background:#fbfcfe;border-bottom:1px solid var(--line);display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:13px}
.fbar .fl{color:var(--brand);font-weight:700}
.fbar input,.fbar select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.fbar input[type=text]{width:190px}
.fbar .qd button{padding:4px 9px;font-size:12.5px;border-radius:20px}
.fbar .on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.fbar .tool{background:var(--brand);color:#fff;border-color:var(--brand)}
.fbar .tool:hover{background:#1f4f8a;color:#fff}
.fbar .sp{flex:1}
.fcount{background:var(--brand2);color:#fff;border-radius:20px;padding:0 7px;font-size:11px;font-weight:700}
#scanbox{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:center;justify-content:center;z-index:30}
#scanbox .box{background:#fff;border-radius:14px;padding:18px 20px;width:min(720px,94vw);max-height:86vh;overflow:auto}
#scanbox .w{display:inline-block;margin:3px;padding:3px 10px;border:1px solid var(--line);border-radius:20px;cursor:pointer;background:var(--soft2)}
#scanbox .w.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
#scanbox img{max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line)}
.rt{display:flex;gap:10px;align-items:flex-start}.rt .ic{font-size:22px;line-height:1}
.rst{font-size:11px;border-radius:20px;padding:0 8px;font-weight:700}.rst.running{background:#fff1d6;color:#8a4b00}.rst.done{background:#d9f2e4;color:#12613a}.rst.error{background:#fde2dc;color:#9a2a10}
.rep td{vertical-align:middle}.rep a{margin-inline-start:8px;white-space:nowrap}
.recp label{display:inline-flex;gap:4px;align-items:center;margin:3px 8px 3px 0;background:var(--soft2);border-radius:20px;padding:2px 10px}
.pwd{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;background:var(--soft);border-radius:6px;padding:0 6px}
.ptitle{display:none}
@media print{
  header,.tabsbar,.bar,.fpanel,.chips,.actions,#toast,#log,#login,#scanbox,.np{display:none!important}
  body{background:#fff}
  main{display:block;height:auto;padding:0}
  .col{border:0;box-shadow:none;overflow:visible;margin-bottom:14px}
  .col h3{position:static}
  .res{break-inside:avoid}
  .ptitle{display:block;padding:0 4px 10px;border-bottom:2px solid var(--brand2);margin-bottom:8px}
  .ptitle b{font-size:17px;color:var(--brand)}
}

/* ===================================================== crystal theme (v2.1) */
body[data-mode=companies] main{grid-template-columns:minmax(300px,32%) 1fr}
body{background:radial-gradient(1100px 600px at 8% -12%,rgba(110,160,255,.55),transparent 60%),
  radial-gradient(900px 520px at 108% 6%,rgba(255,168,90,.38),transparent 62%),
  radial-gradient(800px 600px at 50% 120%,rgba(120,210,220,.35),transparent 60%),
  linear-gradient(160deg,#e9f0fb 0%,#dde8f7 45%,#f5eee6 100%) fixed}
header{background:linear-gradient(120deg,rgba(13,36,70,.92),rgba(27,72,130,.86) 55%,rgba(44,104,170,.82));
  backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
  border-bottom:1px solid rgba(255,255,255,.25);box-shadow:0 6px 24px rgba(13,36,70,.35),inset 0 1px 0 rgba(255,255,255,.25);position:relative}
header::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,#f7b267,#e07a1f,#f7b267);opacity:.9}
.tabsbar,.fpanel{background:rgba(255,255,255,.55);backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);
  border-bottom:1px solid rgba(255,255,255,.7)}
.bar{background:transparent}
.col,.card,.fpanel .fgrid input,.fpanel .fgrid select,.sbox,.chip,.menu .mbox,.res .tno{
  background:rgba(255,255,255,.62);backdrop-filter:blur(18px) saturate(175%);-webkit-backdrop-filter:blur(18px) saturate(175%);
  border:1px solid rgba(255,255,255,.78)}
.col{position:relative;border-radius:18px;box-shadow:0 10px 34px rgba(31,63,120,.16),inset 0 1px 0 rgba(255,255,255,.95)}
.col::before{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;
  background:linear-gradient(125deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(255,255,255,.25) 100%)}
.col h3{background:rgba(255,255,255,.55);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.8)}
.res{border-bottom:1px solid rgba(20,50,92,.07);transition:background .15s,transform .15s}
.res:hover{background:rgba(255,255,255,.75);transform:translateX(-2px)}
.res.sel{background:linear-gradient(90deg,rgba(255,242,229,.95),rgba(255,255,255,.6));border-right:4px solid var(--brand2)}
.sbox{border-radius:14px;box-shadow:0 6px 20px rgba(31,63,120,.12),inset 0 1px 0 #fff}
button{border-radius:10px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(31,63,120,.10),inset 0 1px 0 #fff}
button.pri{background:linear-gradient(180deg,#f8a54c 0%,#e07a1f 55%,#cf6a12 100%);border-color:#d8741c;color:#fff;
  box-shadow:0 6px 18px rgba(224,122,31,.38),inset 0 1px 0 rgba(255,255,255,.55);position:relative;overflow:hidden}
button.pri::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transition:left .6s}
button.pri:hover::after{left:120%}
.ib.zt{background:linear-gradient(180deg,#9ccf6a,#5f9e35);color:#fff;border-color:#5f9e35;box-shadow:0 6px 16px rgba(95,158,53,.35),inset 0 1px 0 rgba(255,255,255,.5)}
header button,.menu summary{background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.35)!important;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.ctry{background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.ctry button{background:transparent!important;box-shadow:none;border:0}
.ctry button.on{background:linear-gradient(180deg,#fff,#e8f0fb)!important;color:var(--brand)}
.tabsbar .seg button{background:transparent;box-shadow:none;border:0}
.tabsbar .seg button.on{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.6));color:var(--brand);
  box-shadow:0 -2px 12px rgba(31,63,120,.10);border-bottom:3px solid var(--brand2)}
.chip{border-radius:20px;box-shadow:0 2px 8px rgba(31,63,120,.08),inset 0 1px 0 #fff}
.chip.on{background:linear-gradient(180deg,#f8a54c,#e07a1f);border-color:#e07a1f;color:#fff}
.card.glass{background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,255,255,.55))}
th{background:rgba(234,241,251,.85)}
table{background:rgba(255,255,255,.55);border-radius:10px;overflow:hidden}
.tick{font-size:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:4px 12px;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9fb3c8;margin-inline-end:6px;vertical-align:middle}
.dot.on{background:#3ee07a;box-shadow:0 0 0 0 rgba(62,224,122,.7);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,224,122,.7)}70%{box-shadow:0 0 0 9px rgba(62,224,122,0)}100%{box-shadow:0 0 0 0 rgba(62,224,122,0)}}
.dym{margin:8px 12px;padding:8px 12px;border-radius:12px;background:linear-gradient(90deg,rgba(255,236,214,.95),rgba(255,255,255,.7));
  border:1px solid rgba(224,122,31,.35);display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.dym a{background:#fff;border:1px solid rgba(224,122,31,.4);border-radius:20px;padding:2px 10px;text-decoration:none;color:var(--brand)}
.overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(12,28,56,.42);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.ovbox{width:min(1150px,95vw);height:90vh;display:flex;flex-direction:column;border-radius:20px;padding:14px 16px;
  background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(246,250,255,.82));border:1px solid rgba(255,255,255,.9);
  box-shadow:0 30px 80px rgba(12,28,56,.35),inset 0 1px 0 #fff;overflow:hidden}
.ovtop{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid rgba(20,50,92,.1);margin-bottom:10px}
.ovtop b{font-size:16px;color:var(--brand)}.ovtop .sp{flex:1}
#ovb{flex:1;overflow:auto;display:flex;flex-direction:column}
.ovframe{flex:1;min-height:65vh;width:100%;border:1px solid rgba(20,50,92,.12);border-radius:12px;background:#fff}
.acts2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.busy{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 10px;color:var(--muted)}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid rgba(224,122,31,.2);border-top-color:#e07a1f;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.anagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.anacard{background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:10px 12px;box-shadow:0 6px 20px rgba(31,63,120,.10)}
.anacard h4{margin:2px 0 8px}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const isFz=s=>/فواز|fawaz/i.test(s||'');
const today=new Date().toISOString().slice(0,10);
const CN={KW:'الكويت',SA:'السعودية',AE:'الإمارات'};
let mode='items',status='',fresh=0,country='',current=null,hits=[],lastQ='';
const STATUSES=['مطروحة','اتوافق على طرحها','إعلان مسبق','مقفولة - تحت الدراسة','أسعار معلنة','مترسية','عقد جاري (قرار الجهاز)','ملغاة'];
function stClass(s,closing){if(s==='مطروحة'){const d=(new Date(closing)-new Date(today))/864e5;return d<=7?'st-soon':'st-open'}
  return {'مترسية':'st-award','ملغاة':'st-cancel','عقد جاري (قرار الجهاز)':'st-run','اتوافق على طرحها':'st-soon','إعلان مسبق':'st-soon'}[s]||'st-study'}
function toast(m,ms=4000){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms)}
function chk(r,j){if(r.status===401){showLogin();const e=new Error(j.error||'سجّل دخولك');e.login=1;throw e}if(j&&j.error)throw new Error(j.error);return j}
async function get(u){const r=await fetch(u);return chk(r,await r.json())}
async function post(u,b={}){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return chk(r,await r.json())}
// ---------------------------------------------------------------- login + permissions (same accounts as the phone app)
let ME=null;
const can=p=>!!ME&&(p==='admin'?ME.admin:(ME.perms.includes(p)||(p==='awards'&&ME.perms.includes('watch'))));
const MODE_NEED0=1;const MODE_NEED={items:'dir',news:'news',awards:'awards',companies:'companies',projects:'projects',routines:'routines',watch:'watch'};
// the filter bar (every tab): period, order, company, client
function FX(){const o={dfrom:$('#fdfrom').value,dto:$('#fdto').value,sort:$('#fsort').value,company:$('#fco').value.trim(),client:$('#fcl').value.trim(),dby:mode==='items'?$('#fdby').value:''};
  Object.keys(o).forEach(k=>{if(!o[k])delete o[k]});return o}
function fxq(){const p=new URLSearchParams(FX()).toString();return p?'&'+p:''}
function fxCount(){const n=Object.keys(FX()).length;$('#fcount').textContent=n;$('#fcount').style.display=n?'':'none';$('#bfil').classList.toggle('on',n>0);return n}
$('#bfil').onclick=()=>$('#fbar').classList.toggle('open');
function wfilter(list,dateOf,textOf,clientOf){const f=FX();if(!Object.keys(f).length)return list;
  let out=list.filter(x=>{const d=(dateOf(x)||'').slice(0,10);
    if(f.dfrom&&!(d&&d>=f.dfrom))return false;if(f.dto&&!(d&&d<=f.dto))return false;
    if(f.company&&!norm(f.company).split(' ').every(w=>norm(textOf(x)).includes(w)))return false;
    if(f.client&&!norm(f.client).split(' ').every(w=>norm((clientOf||textOf)(x)).includes(w)))return false;return true});
  if(f.sort==='new')out=out.slice().sort((a,b)=>(dateOf(b)||'').localeCompare(dateOf(a)||''));
  if(f.sort==='old')out=out.slice().sort((a,b)=>(dateOf(a)||'9').localeCompare(dateOf(b)||'9'));
  return out}
function setPeriod(v){const d=new Date();let from;if(v==='y')from=d.getFullYear()+'-01-01';else{d.setDate(d.getDate()-(+v));from=d.toISOString().slice(0,10)}
  $('#fdfrom').value=from;$('#fdto').value='';if(!$('#fsort').value)$('#fsort').value='new';search()}
function showLogin(msg){ME=null;$('#login').style.display='flex';$('#lerr').textContent=msg||'';setTimeout(()=>($('#lu').value?$('#lp'):$('#lu')).focus(),50)}
$('#lform').onsubmit=async e=>{e.preventDefault();$('#lerr').textContent='';$('#lgo').disabled=true;
  try{const r=await post('/api/login',{u:$('#lu').value.trim(),pw:$('#lp').value,remember:$('#lr').checked});
    if(!r.ok){$('#lerr').textContent=r.msg;return}
    $('#lp').value='';$('#login').style.display='none';start(r.me)}
  catch(x){$('#lerr').textContent='البرنامج مش شغال - افتحه من الأيقونة'}finally{$('#lgo').disabled=false}};
$('#lforgot').onclick=async e=>{e.preventDefault();const u=$('#lu').value.trim();if(!u){$('#lerr').textContent='اكتب اسم المستخدم الأول';return}
  $('#lerr').textContent='...';try{const r=await post('/api/forgot',{u});$('#lerr').textContent=r.msg}catch(x){$('#lerr').textContent=x.message}};
$('#btnOut').onclick=async()=>{await post('/api/logout').catch(()=>{});location.reload()};
function applyMe(me){
  ME=me;$('#me').textContent='👤 '+me.u+(me.expires?' · لحد '+dmy(me.expires):'');$('#me').style.display='';$('#btnOut').style.display='';
  document.querySelectorAll('#mode button').forEach(b=>b.style.display=can(MODE_NEED[b.dataset.m])?'':'none');
  const cs=me.countries||[];
  document.querySelectorAll('#ctry button').forEach(b=>b.style.display=!b.dataset.c?(cs.length>1?'':'none'):(cs.includes(b.dataset.c)?'':'none'));
  if(cs.length===1){country=cs[0];document.querySelectorAll('#ctry button').forEach(x=>x.classList.toggle('on',x.dataset.c===country))}
  $('#autoRow').style.display=can('admin')?'':'none';
  $('#bfil').style.display=can('filters')?'':'none';if(!can('filters'))$('#fbar').classList.remove('open');
  $('#bscan').style.display=can('scan')?'':'none';$('#bprint').style.display=can('print')?'':'none';
  $('#bana').style.display=can('analysis')?'':'none';$('#bzt').style.display=can('zatoona')?'':'none';
  if(!can('fawaz'))wsec='conews';
  const first=[...document.querySelectorAll('#mode button')].find(b=>b.style.display!=='none');
  if(!first){$('#results').innerHTML='<div class="empty">الحساب ده مالوش أي صلاحية - كلّم الأدمن</div>';return false}
  if(!can(MODE_NEED[mode])){first.click();return false}
  return true;
}
function start(me){if(applyMe(me))status_(true).then(()=>search());else status_(true)}
async function boot(){try{const r=await get('/api/me');r.me?start(r.me):showLogin()}catch(e){showLogin('البرنامج مش شغال - افتحه من الأيقونة')}}
// official page of the announcement (Dubai eSupply needs its guest session first)
function openOfficial(url){
  if(!url)return;
  if(url.includes('esupply.dubai.gov.ae')){const w=window.open('https://esupply.dubai.gov.ae/esop/guest/go/public/opportunity/current','_blank');
    setTimeout(()=>{try{w.location=url}catch(e){}},2500);return}
  window.open(url,'_blank');
}
function offLink(r){return r.official?`<a class="off" href="#" data-off="${esc(r.official)}" title="${esc(r.official_label||'')}">الإعلان الرسمي ↗</a>`:''}

  if(d.decisions)h+=`<h4>🏛 قرارات وتوصيات الجهاز (${d.decisions.length})</h4>`+(d.decisions.map(x=>`<div class="hit"><div><b>محضر ${esc(x.meeting||'')} ${dmy(x.mdate)}</b><div class="snip" style="max-height:none">${esc(x.decision||x.snippet)}</div></div></div>`).join('')||'<p class="snip">مفيش</p>');
  if(d.complaints)h+=`<h4>⚖ الشكاوى والتظلمات (${d.complaints.length})</h4>`+(d.complaints.map(x=>`<div class="hit"><div><b>محضر ${esc(x.meeting||'')} ${dmy(x.mdate)}</b><div class="snip" style="max-height:none">${esc(x.snippet)}</div></div></div>`).join('')||'<p class="snip">مفيش</p>');
  if(d.events)h+=`<h4>🕒 تسلسل الأحداث</h4><table>${d.events.map(e=>`<tr><td style="white-space:nowrap">${dmy(e.date)}</td><td>${esc(e.text)}</td></tr>`).join('')}</table>`;
  $('#detail').innerHTML=h+'</div>';wireOff($('#detail'));wireCox($('#detail'));
  $('#detail').querySelectorAll('[data-it]').forEach(t=>t.onclick=()=>detail(+t.dataset.it));
  $('#detail').querySelectorAll('[data-aw]').forEach(t=>t.onclick=()=>{goMode('awards');awardDetail(+t.dataset.aw)})}
// ---------------------------------------------------------------- 📊 التحليل البياني (of whatever is on screen)
function bars(title,pairs,fmt){if(!pairs.length)return '';const mx=Math.max(...pairs.map(p=>p[1]))||1;
  return `<div class="anacard"><h4>${title}</h4>${pairs.map(([k,v])=>`<div class="abar"><span class="ak" title="${esc(k)}">${esc(k)}</span><span class="at"><i style="width:${Math.max(2,v/mx*100)}%"></i></span><b>${fmt?fmt(v):v.toLocaleString('en')}</b></div>`).join('')}</div>`}
function topN(rows,f,n){const c={};rows.forEach(r=>{const k=f(r);if(k)c[k]=(c[k]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,n||10)}
function sumBy(rows,f,v,n){const c={};rows.forEach(r=>{const k=f(r),x=money(v(r));if(k&&x)c[k]=(c[k]||0)+x});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,n||10)}
function money(v){const m=String(v||'').replace(/,/g,'').match(/\d+(\.\d+)?/);return m?+m[0]:0}
function analysis(){const k=LAST.kind,R=LAST.rows||[];if(!R.length)return toast('مفيش نتايج على الشاشة تتحلل - دوّر الأول');
  const F={items:{d:r=>r.publish||r.award_date,org:r=>r.org,st:r=>r.status,w:r=>r.winner,v:r=>r.value,c:r=>CN[r.country]},
    news:{d:r=>r.date,org:r=>r.source,st:r=>r.cats&&r.cats.split(',')[0],c:r=>CN[r.country]},
    awards:{d:r=>r.date,org:r=>r.org,w:r=>r.winner,v:r=>r.total},
    company:{d:r=>r.date,org:r=>r.org,st:r=>r.kind,v:r=>r.value}}[k]||{d:r=>r.date};
  const fmt=v=>v>=1e6?(v/1e6).toFixed(1)+' م':v>=1e3?(v/1e3).toFixed(0)+' ألف':v.toFixed(0);
  let h=`<p class="snip" style="max-height:none">${R.length.toLocaleString('en')} صف من "${esc((document.querySelector('#mode button.on')||{}).textContent||'')}"${$('#q').value.trim()?' · بحث: '+esc($('#q').value.trim()):''}</p><div class="anagrid">`;
  if(F.st)h+=bars('حسب الحالة / النوع',topN(R,F.st));
  if(F.c)h+=bars('حسب الدولة',topN(R,F.c));
  h+=bars('حسب الشهر (آخر 12)',topN(R,r=>String(F.d(r)||'').slice(0,7).match(/^\d{4}-\d\d$/)?String(F.d(r)).slice(0,7):'',99).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12).reverse());
  if(F.org)h+=bars('أكتر الجهات',topN(R,F.org,10));
  if(F.w)h+=bars('أكتر الشركات فوزاً',topN(R,F.w,10));
  if(F.v&&F.w)h+=bars('أكبر الشركات بالقيمة (د.ك)',sumBy(R,F.w,F.v,10),fmt);
  if(F.v&&F.org)h+=bars('القيمة حسب الجهة',sumBy(R,F.org,F.v,10),fmt);
  $('#ovt').textContent='📊 التحليل البياني';$('#ovb').innerHTML=h+'</div>';openOv()}
$('#bana').onclick=analysis;
// ---------------------------------------------------------------- 🫒 الزتونة
function md2html(md){const e=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\(<?([^)>]+)>?\)/g,(m,t,u)=>/^https?:/.test(u)?`<a href="#" data-off="${u}">${t}</a>`:`<a href="#" data-ext="${u}">${t}</a>`);
  const L=md.split(/\r?\n/);let h='',i=0;
  while(i<L.length){const l=L[i];
    if(/^\|/.test(l)){const rows=[];while(i<L.length&&/^\|/.test(L[i])){if(!/^\|\s*-/.test(L[i]))rows.push(L[i].replace(/^\||\|$/g,'').split('|'));i++}
      h+='<table>'+rows.map((r,j)=>'<tr>'+r.map(c=>j?`<td>${e(c.trim())}</td>`:`<th>${e(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>';continue}
    if(/^#{1,4} /.test(l)){const n=l.match(/^#+/)[0].length;h+=`<h${n+1}>${e(l.replace(/^#+ /,''))}</h${n+1}>`}
    else if(/^---+$/.test(l.trim()))h+='<hr>';
    else if(/^\s*[-*] /.test(l)){h+='<ul>';while(i<L.length&&/^\s*[-*] /.test(L[i])){h+=`<li>${e(L[i].replace(/^\s*[-*] /,''))}</li>`;i++}h+='</ul>';continue}
    else if(l.trim())h+=`<p>${e(l)}</p>`;i++}
  return h}
let ZT=null;
async function zatoona(q){q=(q||$('#q').value).trim();
  let rec={};try{rec=await get('/api/zatoona')}catch(e){}
  $('#ovt').textContent='🫒 الزتونة';
  $('#ovb').innerHTML=`<p class="snip" style="max-height:none">لما مش لاقي حاجة في داتا البرنامج: Claude بيدوّر في موقع الجهاز المركزي والجريدة والأخبار وملفاتنا، ويطلّع تقرير مختصر بالمصادر (بياخد من دقيقتين لـ 10).</p>
    <div class="zrow"><input id="ztq" value="${esc(q)}" placeholder="مثلاً: هـ ط 241 الطريق الإقليمي - أو اسم شركة"><input id="zth" placeholder="ملاحظة (اختياري): عاوز الترسية بس، أو الأسعار..."><button class="pri" id="ztgo">🫒 هات الزتونة</button></div>
    <div id="ztout">${rec.running?`<div class="busy"><div class="spin"></div><p>شغالة دلوقتي على «${esc(rec.running.q)}»...</p></div>`:''}</div>
    ${(rec.recent||[]).length?`<h4>زتونات قبل كده</h4><table>${rec.recent.map(f=>`<tr><td><a href="#" data-zf="${esc(f.path)}">${esc(f.name)}</a></td><td>${esc(f.at.replace('T',' '))}</td></tr>`).join('')}</table>`:''}`;
  openOv();
  $('#ztgo').onclick=async()=>{const r=await post('/api/zatoona',{q:$('#ztq').value.trim(),hint:$('#zth').value.trim()});if(r.state==='error'||!r.id)return toast(r.msg,9000);ZT=r.id;pollZt()};
  $('#ovb').querySelectorAll('[data-zf]').forEach(a=>a.onclick=async e=>{e.preventDefault();const t=await (await fetch(outUrl(a.dataset.zf))).text();showMd(a.textContent,t,a.dataset.zf)});
  if(rec.running){ZT=rec.running.id;pollZt()}}
async function pollZt(){if(!ZT)return;const j=await get('/api/zatoona?job='+ZT).catch(()=>null);if(!j)return;
  if(j.state==='running'){if($('#ztout'))$('#ztout').innerHTML=`<div class="busy"><div class="spin"></div><p>Claude بيدوّر على «${esc(j.q)}» من ${Math.floor(j.elapsed/60)}:${String(j.elapsed%60).padStart(2,'0')} دقيقة...</p></div>`;setTimeout(pollZt,5000);return}
  ZT=null;if(j.state==='done')showMd('🫒 الزتونة: '+j.q,j.md,j.path);else{if($('#ztout'))$('#ztout').innerHTML=`<p class="snip" style="color:var(--warn)">${esc(j.msg)}</p>`;toast(j.msg,9000)}}
function showMd(title,md,path){$('#ovt').textContent=title;
  $('#ovb').innerHTML=`<div class="acts2"><button data-rev="${esc(path)}">📁 الفولدر</button><button id="ztcopy">📋 نسخ</button><button id="ztnew">🫒 زتونة جديدة</button></div><div class="mdv">${md2html(md)}</div>`;
  openOv();wireOutBtns();wireOff($('#ovb'));$('#ztcopy').onclick=()=>navigator.clipboard.writeText(md).then(()=>toast('اتنسخ'));$('#ztnew').onclick=()=>zatoona('')}
$('#bzt').onclick=()=>zatoona();
// ---------------------------------------------------------------- البحث بصورة
const STOPW=new Set(['في','من','على','الى','إلى','عن','مع','او','أو','و','ال','هذا','هذه','التي','الذي','ذلك','تم','رقم','لسنة','بشأن','the','and','of','for','to','in','on','no']);
async function scanImage(dataUrl){$('#scanbox').style.display='flex';$('#scanbody').innerHTML=`<img src="${dataUrl}"><p class="snip">بقرا الكلام اللي في الصورة...</p>`;
  let text='';try{text=(await post('/api/ocr-image',{image:dataUrl})).text||''}catch(e){$('#scanbody').innerHTML=`<p>خطأ: ${esc(e.message)}</p>`;return}
  const words=[...new Set((text.match(/[؀-ۿA-Za-z0-9\/\-]{2,}/g)||[]).filter(w=>!STOPW.has(norm(w))))].slice(0,80);
  const lines=text.split('\n').map(x=>x.trim()).filter(x=>x.length>5).slice(0,12);
  if(!words.length){$('#scanbody').innerHTML=`<img src="${dataUrl}"><p>ملقتش كلام واضح في الصورة - جرّب صورة أوضح أو أقرب.</p>`;return}
  $('#scanbody').innerHTML=`<img src="${dataUrl}"><p class="snip">علّم الكلمات اللي تدوّر بيها (البحث بيلاقي الشبيه كمان) أو اختار سطر كامل:</p>
    <div>${words.map(w=>`<span class="w ${/\d/.test(w)||w.length>=4?'on':''}">${esc(w)}</span>`).join('')}</div>
    <p class="snip" style="margin-top:10px">أو سطر كامل:</p>${lines.map(l=>`<div class="res" data-line="${esc(l)}" style="border:1px solid var(--line);border-radius:8px;margin:4px 0">${esc(l)}</div>`).join('')}`;
  $('#scanbody').querySelectorAll('.w').forEach(w=>w.onclick=()=>w.classList.toggle('on'));
  $('#scanbody').querySelectorAll('[data-line]').forEach(l=>l.onclick=()=>{$('#q').value=SCANQ=l.dataset.line;$('#scanbox').style.display='none';search()});
}
$('#scango').onclick=()=>{const w=[...document.querySelectorAll('#scanbody .w.on')].map(x=>x.textContent);if(!w.length)return toast('علّم كلمة واحدة على الأقل');
  $('#q').value=SCANQ=w.join(' ');$('#scanbox').style.display='none';search()};
$('#scanall').onclick=()=>document.querySelectorAll('#scanbody .w').forEach(x=>x.classList.add('on'));
$('#scanx').onclick=()=>$('#scanbox').style.display='none';
$('#bscan').onclick=()=>$('#fscan').click();
$('#fscan').onchange=()=>{const f=$('#fscan').files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>scanImage(rd.result);rd.readAsDataURL(f);$('#fscan').value=''};
document.addEventListener('paste',e=>{const it=[...(e.clipboardData||{}).items||[]].find(x=>x.type.startsWith('image/'));if(!it)return;
  e.preventDefault();const rd=new FileReader();rd.onload=()=>scanImage(rd.result);rd.readAsDataURL(it.getAsFile())});
// ---------------------------------------------------------------- طباعة
$('#bprint').onclick=()=>{const f=FX(),tab=document.querySelector('#mode button.on').textContent;
  const parts=[tab,$('#q').value.trim()&&('بحث: '+$('#q').value.trim()),country&&CN[country],f.dfrom&&('من '+dmy(f.dfrom)),f.dto&&('لحد '+dmy(f.dto)),f.company&&('الشركة: '+f.company),f.client&&('الجهة: '+f.client)].filter(Boolean);
  $('#ptitle').innerHTML=`<b>GCC Tenders - ${esc(tab)}</b><div class="snip">${esc(parts.join(' · '))} · اتطبع ${new Date().toLocaleString('en-GB')}</div>`;window.print()};
// ---------------------------------------------------------------- filter bar wiring
['#fdfrom','#fdto','#fsort','#fdby'].forEach(s=>$(s).onchange=()=>{fxCount();search()});
['#fco','#fcl'].forEach(s=>$(s).addEventListener('input',()=>{fxCount();clearTimeout(deb);deb=setTimeout(search,500)}));
document.querySelectorAll('[data-qd]').forEach(b=>b.onclick=()=>{setPeriod(b.dataset.qd);fxCount()});
$('#fclear').onclick=()=>{['#fdfrom','#fdto','#fco','#fcl'].forEach(s=>$(s).value='');$('#fsort').value='';$('#fdby').value='';fxCount();search()};
boot();
</script>
