<style>

  --brand:#0b2a4a;--brand-2:#123b63;--accent:#0e7c86;--accent-soft:#e3f2f3;--on-brand:#ffffff;
  --fz:#fff1a8;--ok:#177245;--warn:#b42318;--link:#0b5cad;--unread:#fff6e0;--unreadb:#e8a317;--red:#e5484d;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 4px 14px rgba(15,27,45,.06);--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0b1220;--card:#131c2b;--ink:#e8eef6;--muted:#9eaabb;--faint:#738097;--line:#24324a;
  --brand:#0b2340;--brand-2:#123358;--accent:#2bb3bf;--accent-soft:#12303a;--fz:#5c5112;--ok:#4cc38a;--warn:#ff8a7a;
  --link:#7ab8ff;--unread:#2e2510;--unreadb:#d4950f;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1220;--card:#131c2b;--ink:#e8eef6;--muted:#9eaabb;--faint:#738097;--line:#24324a;
  --brand:#0b2340;--brand-2:#123358;--accent:#2bb3bf;--accent-soft:#12303a;--fz:#5c5112;--ok:#4cc38a;--warn:#ff8a7a;--link:#7ab8ff;--unread:#2e2510;--unreadb:#d4950f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans Arabic","Segoe UI",Tahoma,Roboto,"Noto Sans Arabic",Arial,sans-serif}
button{font:inherit}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--on-brand);padding:12px 14px 10px;padding-top:max(12px,env(safe-area-inset-top));box-shadow:0 2px 10px rgba(11,42,74,.25)}
header .row{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}.logo img{width:32px;height:32px;object-fit:contain}
.brandname{flex:1;line-height:1.2}
.brandname b{display:block;font-size:17px;letter-spacing:.3px}
.brandname span{font-size:11.5px;opacity:.75}
header .upd{font-size:10.5px;opacity:.75;text-align:end;line-height:1.3}
#who{font-size:11px;text-align:end;cursor:pointer;background:rgba(255,255,255,.12);border-radius:20px;padding:3px 10px;line-height:1.3;direction:ltr}
#who:empty{display:none}
.ctry{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.ctry button{border:1px solid rgba(255,255,255,.28);border-radius:20px;background:transparent;color:var(--on-brand);padding:4px 13px;font-size:13px;white-space:nowrap}
.ctry button.on{background:#fff;color:var(--brand);font-weight:600;border-color:#fff}
/* bottom navigation */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:15;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(15,27,45,.06)}
.tabs button{flex:1;border:0;background:transparent;color:var(--faint);font-size:11px;padding:4px 2px;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent);font-weight:600}
.tabs button.on::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:3px;background:var(--accent)}
.bdg{position:absolute;top:0;left:calc(50% - 22px);min-width:18px;height:18px;line-height:18px;padding:0 5px;border-radius:20px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;box-shadow:0 0 0 2px var(--card)}
.bdg:empty{display:none}
.search{padding:12px 12px 4px;position:sticky;top:var(--hh,118px);z-index:4;background:var(--bg)}
.search input{width:100%;font:inherit;font-size:15.5px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 12px;font-size:12.5px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip b{margin-inline-start:5px;font-weight:600;opacity:.8}
.chip .nw{background:var(--red);color:#fff;border-radius:20px;padding:0 6px;margin-inline-start:5px;font-size:11px}
.list{padding:0 12px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card.unread{background:var(--unread);border-color:var(--unreadb);border-inline-start:4px solid var(--unreadb)}
.card .t{font-weight:600;font-size:14.5px;line-height:1.5}
.m{color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:5px;align-items:center}
.st{font-size:11.5px;padding:1px 9px;border-radius:20px;font-weight:600}
.st-open{background:#dcf3e6;color:#11603a}.st-soon{background:#fdecd2;color:#8a4b00}.st-study{background:#e7ecf3;color:#34465c}
.st-award{background:#e0e8fb;color:#1f3f8a}.st-cancel{background:#fbe0df;color:#8a1f1f}.st-run{background:#efe4fb;color:#5b2a86}
.flag{font-size:11px;border-radius:20px;padding:0 8px;font-weight:600}.new{background:var(--link);color:#fff}.chg{background:#ffe2bd;color:#7a3e00}
.wk{font-size:11px;border-radius:20px;padding:1px 9px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tno{direction:ltr;unicode-bidi:isolate;background:rgba(127,127,127,.12);border-radius:6px;padding:0 6px;font-size:12px}
.fz{background:var(--fz);border-radius:4px;padding:0 4px}
.fzb{background:var(--fz);font-size:11px;border-radius:20px;padding:0 8px}
.money{color:var(--ok);font-weight:600}
.urgent{color:var(--warn);font-weight:600}
a.off,button.off{color:var(--link);font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:12.5px;background:var(--card)}
.more{display:block;width:100%;padding:11px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--muted);font:inherit}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;display:none;padding-bottom:40px}
#sheet .top{position:sticky;top:0;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));display:flex;gap:10px;align-items:center}
#sheet .top button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:6px 14px}
#sheet .body{padding:14px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:7px 10px;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.kv div:nth-child(odd){color:var(--muted)}
h3{font-size:14px;color:var(--accent);margin:18px 0 8px;font-weight:600}
.ev{border-inline-start:3px solid var(--accent-soft);padding:2px 10px;margin:8px 0;font-size:13px}
.ev b{font-size:12.5px}
.big{display:block;text-align:center;margin:12px 0;padding:12px;border-radius:12px;background:var(--accent);color:#fff!important;text-decoration:none;font-weight:600;border:0;width:100%;font:inherit}
table{border-collapse:collapse;width:100%;font-size:12.5px;background:var(--card)}
td,th{border:1px solid var(--line);padding:5px 6px;text-align:start;vertical-align:top}
th{background:var(--accent-soft);color:var(--ink);font-weight:600}
.note{font-size:12px;color:var(--muted)}
.mail{white-space:pre-wrap;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
#install,#bioOffer{display:none;margin:10px 12px 0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--line);font-size:13px}
#login{position:fixed;inset:0;z-index:40;background:radial-gradient(1200px 600px at 80% -10%,#1c5d8f 0%,transparent 60%),linear-gradient(160deg,#0b2a4a,#071a2e);display:none;align-items:center;justify-content:center;padding:20px}
#login .box{background:var(--card);color:var(--ink);border-radius:20px;padding:26px 20px 18px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
#login .lg{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto}
#login h2{margin:10px 0 2px;font-size:21px;direction:ltr}
#login .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
#login input{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:6px 0;direction:ltr;text-align:left;outline:none}
#login input:focus{border-color:var(--accent)}
#login .err{background:#fbe0df;color:#8a1f1f;border-radius:10px;padding:8px;margin-bottom:8px;font-size:13.5px}
#login a{color:var(--link);text-decoration:none}
#toast{position:fixed;bottom:84px;left:14px;right:14px;background:#0f1b2d;color:#fff;padding:11px 14px;border-radius:12px;display:none;z-index:30;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* dashboard */
.hello{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 10px}
.hello b{font-size:16px}.hello span{color:var(--muted);font-size:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:start;box-shadow:var(--shadow);color:var(--ink);position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;top:0;inset-inline-start:0;width:4px;height:100%;background:var(--accent);opacity:.85}
.tile .tv{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .tl{font-size:12.5px;color:var(--muted);margin-top:4px}
.tile .tg{font-size:11px;color:var(--accent);margin-top:6px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.panel h4{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.panel h4 a{font-size:12px;font-weight:500;color:var(--link);text-decoration:none}
.bar{display:grid;grid-template-columns:72px 1fr 44px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.bar .bt{height:10px;background:var(--accent-soft);border-radius:6px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar b{font-variant-numeric:tabular-nums;text-align:end}
.mini{padding:9px 0;border-bottom:1px solid var(--line)}.mini:last-child{border-bottom:0}
.mini .t{font-size:13.5px;font-weight:600;line-height:1.45}
#lang{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600}
#login .lt{position:absolute;top:14px;inset-inline-end:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:2px 9px;font-size:12px}
#login .box{position:relative}
</style>
</head>

function norm(s){return String(s||'').normalize('NFKC').replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).toLowerCase()}
function stem(w){for(const p of ['وال','بال','كال','فال','لل','ال'])if(w.startsWith(p)&&w.length-p.length>=2)return w.slice(p.length);return w}
function toks(s){return (norm(s).match(/[a-z0-9]+|[ء-ي]+/g)||[]).filter(w=>w.length>1&&!STOP.has(w)).map(stem)}
function digits(s){return norm(s).match(/\d+/g)||[]}
function tokset(o,f){if(!o._t)o._t=new Set(toks(f(o)));return o._t}
function score(q,set,numsField){
  const qt=toks(q).filter(t=>!/^\d+$/.test(t)),qd=digits(q);let sc=0;
  if(qt.length){let g=0;for(const t of qt){if(set.has(t))g+=1;else if(t.length>=4){for(const h of set){if(h.length>=4&&(h.startsWith(t)||t.startsWith(h))){g+=.6;break}}}}sc=g/qt.length}
  if(qd.length){const nd=digits(numsField);const ok=qd.every(x=>nd.includes(x));sc=qt.length?.65*sc+.35*(ok?1:0):(ok?1:0)}
  return sc}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

const IDB={db:null,async open(){if(this.db)return this.db;this.db=await new Promise((ok,no)=>{const r=indexedDB.open('fawaz',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});return this.db},
  async get(k){const db=await this.open();return new Promise(ok=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(undefined)})},
  async set(k,v){const db=await this.open();return new Promise(ok=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok()})},
  async clear(){const db=await this.open();return new Promise(ok=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').clear();t.oncomplete=()=>ok()})}};

async function uid(u){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fawaz:'+u));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,20)}
const expiredMsg=d=>`اشتراكك انتهى يوم ${dmy(d)} - تواصل مع الأدمن للتجديد`;
const getJ=async n=>{const r=await fetch('data/'+n+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(n+' '+r.status);return r.json()};
async function aesOpen(key,enc){const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},key,b64(enc.data));
  return JSON.parse(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}
async function privKeyFrom(e,pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pk8=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},k,b64(e.data));
  return crypto.subtle.importKey('pkcs8',pk8,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt'])}

async function login(u,pw){
  u=String(u||'').trim().toLowerCase();if(!u||!pw)return showLogin('اكتب اسم المستخدم وكلمة السر');
  $('#lgo').textContent='بيدخل...';

  const e=users.users&&users.users[await uid(u)];
  if(!e)return showLogin('اسم المستخدم مش موجود');
  if(e.expired)return wipe(expiredMsg(e.expired));
  if(e.off)return wipe('الحساب ده متوقف - تواصل مع الأدمن');
  let key;try{key=await privKeyFrom(e.priv,pw)}catch(x){return showLogin('كلمة السر غلط')}
  try{await IDB.set('u',u);await IDB.set('key',key);await IDB.set('ver',e.priv.data.slice(0,32))}catch(x){}
  if(LOGIN_U&&LOGIN_U!==u){MK={};store.set('mk',MK)}
  LOGIN_U=u;ACC={u,key};enter(true)}

async function load(silent){
  if(!ACC)return;
  let meta,keys,users;try{[meta,keys,users]=await Promise.all([getJ('meta.json'),getJ('keys.json'),getJ('users.json')])}
  catch(e){if(!silent)$('#list').innerHTML='<div class="empty">مفيش اتصال - جرّب تاني</div>';return}
  const id=await uid(ACC.u),me=users.users&&users.users[id],mine=keys.keys&&keys.keys[id];
  if(!me||me.off)return wipe('الحساب ده اتوقف - تواصل مع الأدمن');
  if(me.expired)return wipe(expiredMsg(me.expired));
  if(!mine)return;
  const sig=JSON.stringify(mine).slice(0,200);
  if(silent&&META.updated===meta.updated&&META._w===sig)return;
  const open=async name=>mine[name]?aesOpen(await unwrap(ACC.key,mine[name]),await getJ(name+'.enc')):null;
  try{const names=Object.keys(mine).filter(n=>n!=='private');
    const got=Object.fromEntries(await Promise.all(names.map(async n=>[n,await open(n)])));

function liveStatus(t){const s=sameItems(t)[0];return s?`<span class="st ${stClass(s.st,s.cl)}">${esc(s.st)}</span>`:''}
function openTender(k){const t=P&&P.tenders.find(x=>x.k===k);if(!t)return;
  let h=`<div style="font-weight:700;font-size:16px;margin-bottom:10px">${esc(t.t)}</div><div class="kv"><div>العميل</div><div>${esc(t.c)}</div>${t.n?`<div>الرقم</div><div><span class="tno">${esc(t.n)}</span></div>`:''}${t.cl?`<div>الإقفال</div><div>${dmy(t.cl)}</div>`:''}<div>المصدر</div><div>${esc(t.src)}</div>${t.st?`<div>الحالة</div><div>${esc(t.st)}</div>`:''}${t.rm?`<div>ملاحظات</div><div>${esc(t.rm)}</div>`:''}${t.rk?`<div>ترتيبنا</div><div><span class="fzb">L${t.rk}</span></div>`:''}</div>`;
  if(t.b.length)h+=`<h3>الأسعار</h3><table><tr><th>#</th><th>الشركة</th><th>السعر</th></tr>${t.b.map((b,i)=>`<tr><td>L${i+1}</td><td class="${US.test(b[0])?'fz':''}">${esc(b[0])}</td><td>${esc(b[1])}</td></tr>`).join('')}</table>`;
  const same=sameItems(t);if(same.length)h+=`<h3>حالتها دلوقتي في الدليل</h3>`+same.map(dirCard).join('');
  const fd=P.feed.filter(f=>f[6]===k);if(fd.length)h+=`<h3>كل اللي اترصد عنها</h3>`+fd.map(f=>`<div class="ev"><b>${f[1].startsWith('2000')?'':esc(f[1].replace('T',' '))+' · '}${esc(f[2])}</b><div>${esc(f[4])}${f[5]?` <a class="off" href="${esc(f[5])}" target="_blank" rel="noopener">↗</a>`:''}</div></div>`).join('');
  showSheet('مناقصة لينا',h);document.querySelectorAll('#sbody .card[data-i]').forEach(c=>c.onclick=()=>openItem(+c.dataset.i))}
function openMail(e){showSheet('إيميل',`<div style="font-weight:700;font-size:15px">${esc(e.s)}</div><div class="m" style="margin-bottom:8px"><span>${esc(e.f)}</span><span>${esc(e.d.replace('T',' '))}</span>${e.a?`<span>📎 ${esc(e.a)}</span>`:''}</div><div class="mail">${esc(e.b)}</div><p class="note">ملف الإكسيل المرفق بيتفتح من برنامج الكمبيوتر.</p>`)}

// ---------------------------------------------------------------- details
function similarAwards(subject,skipRow){const set=new Set(toks(subject));if(!set.size)return[];
  return A.filter(a=>a.r!==skipRow).map(a=>{const t=tokset(a,o=>o.s);let g=0;for(const x of set)if(t.has(x))g++;return [g/set.size,a]}).filter(x=>x[0]>=.55).sort((x,y)=>(Math.round(y[0]*10)-Math.round(x[0]*10))||y[1].d.localeCompare(x[1].d)).slice(0,10).map(x=>x[1])}
function awTable(list){return list.length?`<table><tr><th>التاريخ</th><th>الجهة</th><th>الفائز</th><th>القيمة</th></tr>${list.map(a=>`<tr><td>${dmy(a.d)}</td><td>${esc(a.o)}</td><td class="${US.test(a.w)?'fz':''}">${esc((a.w||'').slice(0,60))}</td><td>${esc(a.v)}</td></tr>`).join('')}</table>`:''}
function showSheet(title,html){$('#stitle').textContent=title;$('#sbody').innerHTML=html;if($('#sheet').style.display!=='block'){history.pushState({sheet:1},'')}$('#sheet').style.display='block';$('#sheet').scrollTop=0}
function closeSheet(){$('#sheet').style.display='none'}
$('#back').onclick=()=>history.back();window.addEventListener('popstate',closeSheet);
function openItem(i){const r=D.find(x=>x.i===i);if(!r)return;
  const F=[['الدولة',CN[r.c]],['الرقم',r.n?`<span class="tno">${esc(r.n)}</span>`:''],['الجهة',esc(r.o)],['الحالة',`<span class="st ${stClass(r.st,r.cl)}">${esc(r.st)}</span>`],
    ['تاريخ الطرح',dmy(r.p)],['آخر موعد',dmy(r.cl)],['سعر الوثائق',esc(r.f)],['التأمين',esc(r.b)],['نوع الطرح',esc(r.t)],
    ['الفائز',r.w?`<span class="${US.test(r.w)?'fz':''}">${esc(r.w)}</span>`:''],['القيمة',r.v?`<span class="money">${esc(r.v)}</span>`:''],['تاريخ الترسية',dmy(r.a)],['نوع الشغل',esc(r.cat)]];
  let h=`<div style="font-weight:700;font-size:16px;margin-bottom:10px">${esc(r.s)}</div><div class="kv">${F.filter(x=>x[1]).map(x=>`<div>${x[0]}</div><div>${x[1]}</div>`).join('')}</div>`;
  if(r.off)h+=`<a class="big" href="${esc(r.off)}" target="_blank" rel="noopener">الإعلان الرسمي ↗ ${esc(r.ol||'')}</a>`;
  {const cd=(P&&P.cd&&P.cd[r.n+'|'+r.o])||[],docs=(r.dc||[]).concat(cd.map(x=>[x[0],x[1],x[2],'الجهاز المركزي']));
   const site=/capt\.gov\.kw/.test(r.off||'')?'الجهاز المركزي':/etimad/.test(r.off||'')?'منصة اعتماد':/esupply/.test(r.off||'')?'دبي eSupply':/pahw/.test(r.off||'')?'الرعاية السكنية':'الموقع الرسمي';
   h+=`<h3>📥 المستندات</h3>`+(r.off?`<a class="big" href="${esc(r.off)}" target="_blank" rel="noopener">🌐 افتح المناقصة على ${site} - سجّل دخولك وحمّل</a>`:'')+(docs.length?docs.map(x=>`<div class="ev"><b>${esc(x[0])}</b> <span class="note">${esc(x[3]||'')} ${esc(x[2]||'')}</span><div><a class="off" href="${esc(x[1])}" target="_blank" rel="noopener">تحميل ↗</a></div></div>`).join('')
     :`<p class="note">${/capt\.gov\.kw/.test(r.off||'')?'كراسة الشروط وملفات المناقصة بتتحمّل من صفحة الجهاز المركزي بعد "تسجيل الدخول" بحسابك.':(r.c!=='KW'?'الكراسة بتتشتري / بتتحمّل من المنصة الرسمية بحساب مورّد.':'مفيش مستندات منشورة.')}</p>`)}
  if(r.chg.length)h+=`<h3>التغييرات اللي اترصدت</h3><table><tr><th>الوقت</th><th>البند</th><th>كان</th><th>بقى</th></tr>${r.chg.map(c=>`<tr><td>${esc(c[0].replace('T',' '))}</td><td>${esc(c[1])}</td><td>${esc(c[2])}</td><td><b>${esc(c[3])}</b></td></tr>`).join('')}</table>`;
  if(r.ev.length)h+=`<h3>كل اللي اتنشر عنها</h3>`+r.ev.map(e=>`<div class="ev"><b>${dmy(e[0])} · ${esc(e[1])} · ${esc(e[2])}</b><div>${esc(e[3])}${e[4]?` <a class="off" href="${esc(e[4])}" target="_blank" rel="noopener">المصدر ↗</a>`:''}</div></div>`).join('');
  if(r.c==='KW'){const sim=similarAwards(r.s,-1);if(sim.length)h+=`<h3>ترسيات سابقة لنفس نوع الشغل</h3>`+awTable(sim)}
  const nw=N.filter(n=>n.c===r.c).map(n=>[score(r.s,tokset(n,o=>o.t),''),n]).filter(x=>x[0]>=.5).sort((a,b)=>b[0]-a[0]).slice(0,6);
  if(nw.length)h+=`<h3>أخبار قريبة</h3>`+nw.map(([s,n])=>`<div class="ev"><b>${dmy(n.d)} · ${esc(n.src)}</b><div><a href="${esc(n.u)}" target="_blank" rel="noopener">${esc(n.t)}</a></div></div>`).join('');
  showSheet(r.k||'مناقصة',h)}
function openAward(row){const a=A.find(x=>x.r===row);if(!a)return;const m=MEET[a.d];
  let h=`<div style="font-weight:700;font-size:16px;margin-bottom:10px">${esc(a.s)}</div><div class="kv">
  <div>الرقم</div><div><span class="tno">${esc(a.n)}</span></div><div>الجهة</div><div>${esc(a.o)}</div>
  <div>الفائز</div><div><span class="${US.test(a.w)?'fz':''}">${esc(a.w||'-')}</span></div><div>القيمة</div><div class="money">${esc(a.v||'-')}</div>
  <div>تاريخ الترسية</div><div>${dmy(a.d)}</div>${a.x?`<div>ملاحظات</div><div>${esc(a.x)}</div>`:''}</div>
  <a class="big" href="https://capt.gov.kw/ar/tenders/opening-tenders/?tender_no=${encodeURIComponent(a.n)}" target="_blank" rel="noopener">🌐 دوّر عليها في موقع الجهاز المركزي - سجّل دخولك وحمّل</a>
  <a class="big" href="${wbUrl(a.d)}" target="_blank" rel="noopener">كشف ترسيات الجهاز يوم ${dmy(a.d)} ↗</a>
  ${m?`<a class="big" style="background:#1F4E78" href="${esc(m.url)}" target="_blank" rel="noopener">محضر اجتماع الجهاز ${esc(m.no)} (PDF) ↗</a>`:''}
  <p class="note">صفحات المحاضر متعلّمة وملف PDF الكامل بيتعمل من برنامج الترسيات على الكمبيوتر.</p>`;
  const same=A.filter(x=>x.r!==a.r&&norm(x.n).replace(/\s/g,'')===norm(a.n).replace(/\s/g,'')&&norm(a.n).length>=4);
  if(same.length)h+=`<h3>صفوف تانية لنفس الرقم</h3>`+awTable(same);
  const sim=similarAwards(a.s,a.r);if(sim.length)h+=`<h3>ترسيات سابقة لنفس نوع الشغل</h3>`+awTable(sim);
  showSheet('ترسية',h)}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));tab=b.dataset.t;shown=150;
  openTabMarks(tab);badges();
  $('#q').placeholder=tr(tab==='awards'?'عنوان أو رقم المناقصة الكويتية القديمة...':tab==='watch'?'ابحث في مناقصاتنا والتحديثات...':'ابحث بالعنوان أو الرقم أو الجهة...');$('#ctry').style.display=tab==='awards'||tab==='watch'?'none':'flex';$('.search').style.display=tab==='home'?'none':'';window.scrollTo(0,0);setH();render()});
document.querySelectorAll('#ctry button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#ctry button').forEach(x=>x.classList.toggle('on',x===b));country=b.dataset.c;status='';shown=150;render()});
let deb;$('#q').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(()=>{shown=150;render()},300)});
function setH(){document.documentElement.style.setProperty('--hh',$('#hdr').offsetHeight+'px')}
window.addEventListener('resize',setH);setH();
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#install').style.display='block'});
$('#btnInstall').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('#install').style.display='none'};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
(async()=>{try{LOGIN_U=(await IDB.get('u'))||''}catch(e){LOGIN_U=''}showLogin();if(LANG==='en')setLang('en');if(bioReady())bioLogin(true)})();
</script>
